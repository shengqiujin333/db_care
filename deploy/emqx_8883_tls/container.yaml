# EMQX 8883 叶子证书基础设施交付清单（ContainerArtifact 入口）
#
# 本文件是本次基础设施交付的入口，描述本目录各文件的用途、依赖路径、执行顺序、
# 验收判据与回退方式；同目录其余文件均由此文件引用。
# 本文件只描述“已制作的配置 + 本次已执行的变更与实测结果”，不包含任何私钥、
# CA 私钥或口令。

kind: tls-listener-certificate-bundle
version: 1
owner_role: devops_engineer
updated_at: "2026-11-25T03:05:00Z"

target:
  resource: existing_service
  host: 8.140.23.253
  service: "EMQX 5.8.0 (systemd unit emqx, node emqx@127.0.0.1)"
  listener: "ssl:default (0.0.0.0:8883, TLS)"
  deployment_mode: >-
    证书由 EMQX Dashboard/API 写入 data/configs/cluster.hocon，listener 以文件路径引用：
    certfile=/var/lib/emqx/certs/listeners/ssl/default/cert-2D2ADC29A9BE14AA
    keyfile =/var/lib/emqx/certs/listeners/ssl/default/key-6E6F6ED56285A948
    cacertfile=/var/lib/emqx/certs/listeners/ssl/default/cacert-613B9023E1E698F0
  unchanged_scope:
    - "MQTT 认证库（mnesia）与用户名/口令规则"
    - "listener 1883 / 8083 / 8084 / 18083 语义与端口"
    - "Flask 注册服务 5000（user_script.service）与 MySQL 3306（docker mysql）"
    - "App 侧目标地址 ssl://8.140.23.253:8883 与信任锚 assets/jd-ca.crt"

files:
  - path: deploy/emqx_8883_tls/container.yaml
    purpose: 本清单（入口）。文件用途、执行顺序、判据、回退与本次执行结果。
  - path: deploy/emqx_8883_tls/leaf-openssl.cnf
    purpose: 叶子证书 CSR/签发模板（CN=8.140.23.253；SAN=IP:8.140.23.253, IP:117.72.84.210；CA:FALSE；serverAuth）。
  - path: deploy/emqx_8883_tls/issue_leaf.sh
    purpose: 在受控主机本地签发叶子证书与私钥（需显式传入 CA 私钥路径），签发前强制核对 CA 私钥与 App 信任锚公钥一致，签发后做链/IP SAN/负例/密钥匹配自检；不打印私钥。
  - path: deploy/emqx_8883_tls/apply_remote.sh
    purpose: 服务器侧安装脚本：门禁自检 → 备份现用证书/私钥 → 安装 → 逐级重载（conf reload → service restart）→ 复核，失败自动回退。
  - path: deploy/emqx_8883_tls/verify_listener.sh
    purpose: 服务器侧只读复核：本机 8883 握手（-verify_ip）、listener/uptime、1883/8083/8084/18083/5000/3306 端口与 HTTP 响应。
  - path: deploy/emqx_8883_tls/rollback_remote.sh
    purpose: 由备份目录恢复原证书/私钥并重启 EMQX，复核回到已知失败基线（serial 77ADCFD9…B82）。
  - path: scripts/emqx_8883_cert_verify.sh
    purpose: 外部只读核验（已存在，本交付直接复用）：从任意主机对 8.140.23.253:8883 做握手 + 链 + SAN + verify_ip + 负例对照。
  - path: evidence/e2e_p0/devops_8883_cert_20261125/
    purpose: 本次变更的原始证据目录（变更前基线、两次 apply 输出、外部核验、清理、变更记录）。

dependencies:
  ca_cert: dengbei_care/app/src/main/assets/jd-ca.crt
  ca_cert_sha256_fingerprint: "75:33:09:B3:9F:1B:8F:85:B4:D7:57:76:BF:D3:8A:42:52:0D:C1:A0:5E:A2:0B:A3:11:7E:B3:9C:BA:B2:15:2B"
  ca_private_key: 由操作主机受控目录提供，经 issue_leaf.sh 参数传入；不进入本仓库、不复制到服务器、不出现在证据中
  tools: [openssl, ssh, emqx ctl, systemctl]

procedure:
  issue: |
    deploy/emqx_8883_tls/issue_leaf.sh --ca-key <CA 私钥路径> --ca dengbei_care/app/src/main/assets/jd-ca.crt \
        --host-ip 8.140.23.253 --out-dir <受控本地目录>
  apply: |
    scp leaf.pem leaf.key jd-ca.crt apply_remote.sh <host>:/root/rd_ops_<date>/
    bash /root/rd_ops_<date>/apply_remote.sh --workdir /root/rd_ops_<date> \
        --certfile /var/lib/emqx/certs/listeners/ssl/default/cert-2D2ADC29A9BE14AA \
        --keyfile  /var/lib/emqx/certs/listeners/ssl/default/key-6E6F6ED56285A948 \
        --ca /root/rd_ops_<date>/jd-ca.crt --host-ip 8.140.23.253
  reload_note: >-
    实测（2026-11-25T02:57Z）：本部署上 `emqx ctl listeners restart ssl:default` 与
    `emqx ctl conf reload` 都不会让 listener 重新读取磁盘上的证书文件（握手仍返回旧叶子证书）；
    必须 `systemctl restart emqx` 才生效（重启后 uptime 归零、全部 listener running）。
    apply_remote.sh 已把该顺序固化为：conf reload → 仍为旧证书则 service restart → 复核。
  verify: |
    bash scripts/emqx_8883_cert_verify.sh 8.140.23.253 8883 dengbei_care/app/src/main/assets/jd-ca.crt --expect-new
    bash /root/rd_ops_<date>/verify_listener.sh      # 服务器侧端口/服务回归
  rollback: |
    bash deploy/emqx_8883_tls/rollback_remote.sh --backup-dir /root/emqx-8883-cert-backup-20261125T025805Z \
        --certfile /var/lib/emqx/certs/listeners/ssl/default/cert-2D2ADC29A9BE14AA \
        --keyfile  /var/lib/emqx/certs/listeners/ssl/default/key-6E6F6ED56285A948 \
        --ca       /root/rd_ops_20261125/jd-ca.crt
    # 脚本需先上传到服务器（备份目录保留在服务器 /root 下，目录 700、私钥 600）

