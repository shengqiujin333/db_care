finding:
  summary: >-
    平台 `POST /upload_data` 在进入请求体校验和数据库写入之前，要求请求头
    `X-Upload-Token` 等于服务端硬编码常量；App 按已批准接口契约只发送
    `Content-Type: application/json`，因此所有真实上传都在该分支被 401 拒绝。
  mechanism:
    - "abr.py:212 `if request.headers.get('X-Upload-Token') != UPLOAD_TOKEN: return 401`"
    - "UPLOAD_TOKEN 定义于 abr.py:21，为字面量常量（48 字符），非环境变量；值不复制到本交付"
    - "该检查位于 `data.get('phone')` / `readings` 校验与 `mysql.connect()` 之前"
  contract_conflict:
    - "已批准契约 IC-002 v4.0 §8：/upload_data 不增加认证头、token 用法、响应字段或表结构"
    - "服务器迁移记录 §八：请求体仅 phone/mac/readings；2026-09-26 初始验证为直接 POST 成功"
    - "/root/abr.py.bak_20260926（7048 B，2026-09-26）不含该常量与该检查；变更前对象 8949 B、2026-10-22 19:31:04"
  impact:
    - "真实 App 上传 2 次、同身份直连 1 次、未注册身份 1 次全部 401；空 JSON 为 400（与检查顺序一致）"
    - "401 在任何 sensor_data 写入之前返回，因此没有可回读的受理行，安卓上传与持久化回读不可达"
    - "E2E-JOINT-P1 平台受理/回读段被阻断；CERT8883-UPLOAD-04 与 FINAL-05 不能判通过"
  security_note: >-
    移除门禁后 /upload_data 回到契约声明的无认证状态（5000 端口对公网开放），
    任何可达客户端都能向 sensor_data 写行。该取舍已由用户在方案选择中确认（见 authorization），
    残留的限流/防滥用措施尚未实现，需另行决策。

