items:
  - "UART1 调试串口初始化与调试打印可在真实目标上观测：固件在上电后初始化 UART1（PA06=UART1_TXD、PA05=UART1_RXD，对应网表 J3.1/J3.2，9600 8N1、PCLK 8 MHz、轮询发送）并打印启动横幅（固件标识、芯片 UID 前 4 字节、复位来源、串口参数），在每个采样周期于判定与发送之后打印一行不超过 96 字节的整数轨迹（RTC 累计节拍、前一有效温度 x10 与存在标志、光照 valid/成功样本数/最小/最大/均值码/无光判定、温度 x10、湿度 x10、上报判定结果、433 发送结果、待上报重试计数）；打印后等待发送完成（TC）再关闭串口，唤醒后重新初始化；关闭串口只允许复位/关闭 UART1 与改写 PA05/PA06，不得复位 GPIOA、不得关闭 GPIOA 时钟、不得改动 PA03/PA04（软 I2C）与 PA07/PA08（SWD）的既有配置；调试打印不得改变采样、判定、发送结果与状态快照；保持 main.c 中被用户注释的 Flash 读保护两行仍为注释（本轮调试不得恢复读保护）。可观测：USB-TTL 接传感器 J3、以 9600 打开 COM42 后复位，可见启动横幅；随后每约 3 分钟出现一条字段完整、无乱码无截断的轨迹行，字段与该周期的实际测量值与判定一致。"
  - "光照采集的完全无光基准 1/3 判据与有效性，并完成实板标定：每次采样在 PB05 输出供电、稳定等待后用 PB04/AIN11 多次转换，采样结束把 PB05 置低，输出结构化结果 {valid, samples_ok, mean_adc_code, code_min, code_max, dark}（均值只取成功样本，全部转换超时为 valid=false）；无光判定为 dark = valid 且 3*mean_adc_code >= C_dark（uint32 乘法、边界相等为暗），每笔独立判断、不使用旧 350/250 滞回或历史暗态；ADC 全部转换超时不得用满量程合成暗态；全暗基准 C_dark 在实板上用完全不透光的遮蔽方式完全遮住光敏器件、以与量产一致的供电、建立等待与取样次数实测取得，回填到单一配置点 LIGHT_DARK_REF_CODE 并置 LIGHT_DARK_CALIBRATED=1，标定记录含板件标识、供电、遮光方式、原始样本分布（最小/最大/均值）、取样次数与配置版本。可观测：当前有光环境下轨迹显示 mean_adc_code 明显低于 ceil(C_dark/3) 且 dark=0；完全遮光后同一周期内 dark=1 且 3*mean_adc_code >= C_dark；移开遮蔽后恢复 dark=0；未取得完全遮光基准时不得置标定完成、不得用满量程或旧默认值或亮态读数冒充 C_dark，并须如实记录未标定状态。"
  - "条件上报判定按升温方向与严格边界并受光照门控：report = 温度与湿度均有效 且 ((存在前一有效温度 且 int32(本次温度 x10 − 前次温度 x10) > 9 且 光照有效 且 无光) 或 (本次温度 x10 > 350))；方向为升温（本次比上次高），差值用 int32 防溢出；恰好 +0.9℃（差=9）不触发，恰好 35.0℃（=350）不满足超温分支但若同时满足升温分支仍触发；无前一有效温度时仅超温分支可触发；光照无效或无光不成立时只关闭升温分支、超温分支独立生效；前一有效温度只在温湿度采样成功后推进，失败周期不推进、不构造 0 值、不冻结待上报样本；接口契约的九组规范向量全部一致。可观测：遮光且本次比上次升温至少 1.0℃ 时轨迹显示 report=1 并在该周期出现 433 发送记录；有光或光照无效时同样升温显示 report=0 且无发送；温度严格超过 35.0℃ 时即使有光也显示 report=1。"
  - "触发的上报样本被冻结后再发送：置待上报时把当次的温度与湿度冻结为快照，组帧只读该快照（明文 10 字节：sensor_id 4 字节 | 温度 x10 小端 2 字节 | 湿度 x10 小端 2 字节 | CRC16-CCITT-FALSE 小端 2 字节），沿用既有 Feistel 加密与 433 有界超时发送；重试期间（含跨采样周期）帧内容与快照逐字节一致，不随新的采样、前值推进或最近有效湿度变化；仅在发送成功时清除待上报；按上限重试用尽则放弃本轮且不伪造成功；帧布局、字节序、单位不变，不新增光照、原因或时间字段。可观测：轨迹中的 report/send/retry 与本次触发样本自洽，未满足判据的周期不出现发送记录；跨周期重试期间快照不变与用尽放弃的行为在发送桩上逐次核对（真实目标不伪造发送失败）。"
  - "跨链路一致性核对（只读，不改网关）：核对网关 CH592 固件按 temp=p[4..5]、hum=p[6..7] 解密传感器帧、按每设备记录 id|湿度大端|温度大端 组装 BLE 载荷，并与 Android 的 u16be@4/s16be@6 解析、单位换算与负温符号逐项一致，形成无需改动网关代码的核对结论；用本轮实机轨迹与已上电网关、手机收到的读数比对，确认同一次上报的传感器温度/湿度与手机显示一致，并记录帧布局在 T1–T4 改动后未发生变化；若发现不一致，登记为跨链路接口问题交负责能力按接口契约处置，本项不做网关功能改动。"
