items:
  - "GXHT40 温湿度采集通路可用：每次采样触发后，驱动能探测 0x44/0x45 地址、发送 0xFD 高重复率测量命令、按 tMEAS 上限等待并读回 6 字节，温度字与湿度字分别通过 CRC-8（poly 0x31、init 0xFF）校验，输出带符号温度 x10（0.1℃，-400..1250）与湿度 x10（0.1%RH，截断 0..1000）；读请求 NACK、CRC 错或无器件时按上限有界重试，整次失败返回失败码且不修改传入的输出。"
  - "光照采集与「完全无光基准 1/3」判据可用：每次采样时 PB05 输出供电，经稳定等待后用 PB04/AIN11 多次转换取成功样本的算术平均并随后将 PB05 置低；光照结果显式表达有效性、平均码值与无光判定，无光当且仅当光照有效且 3×均值 ≥ 全暗基准 C_dark（整数乘法、边界相等为暗），每笔独立判断且不使用滞回或历史暗态；ADC 全部转换超时时结果为无效、不得用满量程合成暗态；C_dark 由完全遮光实板标定取得并回填单一配置点，标定记录含板件、供电、遮光条件、原始样本分布与配置版本，标定完成前配置显式标记未标定且不得让升温分支触发或宣称无光已验收。"
  - "3 分钟采样节拍与采样顺序：RTC 保持 1 分钟中断，累计 3 次才置一次采样请求，上电后另有一次启动采样机会；一个采样周期内只执行一次测量，且先采光照再测温湿度；温湿度整周期失败时不上报、不更新前一有效温度、不冻结待上报样本、不构造 0 值；每次成功的温湿度采样（含未上报或光照无效）推进前一有效温度。"
  - "条件上报判定按升温方向与严格边界：仅当「本次有效温度比上次有效温度高超过 0.9℃ 且光照有效且无光」或「本次温度严格超过 35.0℃」时置待上报，差值用 32 位有符号运算；恰好高 0.9℃、恰好 35.0℃ 且不同时满足升温分支、无前一有效温度且未超温、有光且未超温、降温均不触发；恰好 35.0℃ 若同时满足升温分支（如 34.0℃→35.0℃ 且无光）则触发；光照无效只关闭升温分支，超温分支仍独立触发。"
  - "条件上报发送与冻结样本：仅存在待上报样本时才组装 10 字节帧（sensor_id 4B | 温度 x10 小端 2B | 湿度 x10 小端 2B | CRC16-CCITT-FALSE 小端 2B）并沿用既有 Feistel 加密与 433 有界超时发送；置待上报时冻结当次温度、湿度与 ID，重试期间帧内容与冻结样本逐字节一致而不随新采样改变；编码字节序与加密前后布局保持不变、不新增光照或原因字段；发送失败按上限有界重试，用尽则放弃本轮且不伪造成功，仅发送成功才清除待上报状态。"
  - "退役与新硬件冲突的旧通路：从固件工程与构建中移除 hall/OPTCFG/params/history 模块及其初始化、GPIOB 霍尔中断分支、LPTIM 中的 OPTCFG 分支与写 Flash 参数路径；PB04 仅作为 AIN11 模拟输入、PB05 仅作为光照供电输出、PB06 不再外驱动；上电后不存在可抢占这些引脚或改写参数的遗留通路。"
  - "网关与手机链路兼容核对：核对网关 CH592 固件按 temp=p[4..5]、hum=p[6..7] 取传感器帧字段，BLE 每设备记录为 id|湿度大端|温度大端，并与 Android 的 u16be@4/s16be@6 解析一致；一致时明确记录「无需改动网关代码」的核对结论，不一致时按既有接口契约对齐帧布局与字节序。"
