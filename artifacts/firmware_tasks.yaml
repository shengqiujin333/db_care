items:
  - objective: >-
      确认当前 as-built 固件候选（HEAD 548155d）是本次设计基线：重建传感器 Keil 工程并复跑实现侧宿主自检，
      核对 T1 升温判定/严格 35.0℃、T2 冻结快照与 P 行、T3 UART 有界等待、T4/F-1 GXHT40 驱动与诊断、
      S 行前值快照均已存在且未回归；核对空口/BLE 布局、S/G/P 行格式、3 分钟节拍、失败不推进、
      判据未启用时的 V=0/D=0 安全方向均未改变；静态核查 hall/optcfg/params/history 无活动引用、
      PB04 仅 AIN11、PB05 仅光照供电、PB06 未使用、Flash 读保护两行仍为注释。
      本任务不修改产品源码；任何回归失败只允许最小修复并重新取证。
    input_refs:
      - readme.txt
      - artifacts/firmware_design.md
      - artifacts/firmware_requirements.md
      - artifacts/firmware_rtos_architecture.md
      - artifacts/interface_contract.md
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/USER/src/fw_core.c
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/USER/src/measure.c
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/USER/src/debug_trace.c
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/USER/src/gxht40.c
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/USER/inc/sensor_config.h
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/USER/src/main.c
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/MDK/Project.uvprojx
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/test/build_test.sh
    acceptance:
      - "构建：Keil rebuild 0 Error / ≤1 既有 warning（main.c 空循环体）；本任务不改源码，产物摘要应与历史交付一致（Project.axf md5 a3b08774e764f174eac318f6771d0c42、Project.hex md5 546ce20a718fa69b40177cce0145f4b5、Code=25964 RO=656 RW=116 ZI=1676）；若摘要不同必须给出源码差异说明，不能只改期望值。"
      - "T1：sensor_decide_report 为 cur>350 或（have_prev 且 int32(cur-prev)>9 且 dark）；+0.9℃ 不报、+1.0℃ 报、降温不报、恰好 35.0℃ 可经升温分支上报、无前值仅超温；int16 极值不溢出。"
      - "T2：触发且无待上报时冻结 {temp,hum}；组帧只读冻结快照；重试/跨采样期间帧字节不变；新触发不覆盖；仅成功清除；P 行 rq/s/y/t/h 为组帧实际值且 ≤96 B。"
      - "T3：TXE 永不置位、TXBUSY 永不清零时，打印与关闭在有限循环内返回；超时不改 report_req/前值/冻结快照/发送结果；不复位 GPIOA、不改 PA03/PA04/PA07/PA08。"
      - "T4/F-1：GXHT40 0x44/0x45 探测、0xFD、6 B、双 CRC、x10 换算/有效域、失败后重探与有界恢复仍在；S 行 p/H 为判定前快照（首样本 H=0 p=0）。"
      - "接口/退役：433 明文 10 B、BLE 8 B 布局不变；无 hall/optcfg/params/history 活动引用；PB04=AIN11、PB05=光照供电、PB06 未使用；S/G/P/BOOT 行字节格式不变；Flash 读保护两行仍为注释。"
      - "判据未启用方向：LIGHT_DARK_* 仍为未启用状态时，light_sample 输出 valid=false、dark=false，S 行 V=0 D=0，升温分支不触发；不得把该状态解读为“已识别有光”。"
      - "证据类别：当前构建日志、产物摘要、实现侧宿主自检输出；不把宿主结果冒充实板/跨链路通过。"
    metadata:
      increment: FW-REG-ASBUILT
      title: as-built 候选回归与不变量核对
      priority: highest
      owner: firmware_engineer
      depends_on: []
      as_built_state: implemented_current_source
      evidence_class: host_self_test_and_build
      external_prereq: none
      forbidden: []
      do_not_touch:
        - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/test/*_verify_ev.c
        - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/test/mock_*_ev/
        - CH592EVT/EVT/EXAM/BLE/beiwov2/
        - dengbei_care/

  - objective: >-
      回归 T1/T2/T3 的规范向量与格式化行为，确认该范围无需功能改动：IC-002 §3.1 九组上报向量、
      待上报冻结/重试/跨采样/不覆盖、P 行字段与 96 B 预算、UART TXE/TXBUSY 卡死有界返回、
      S/G/P 既有行逐字节格式。任一向量失败时按最小改动修复并复跑；不得通过改判据、改期望、
      降低断言或修改验证角色资产来通过。
    input_refs:
      - artifacts/firmware_design.md
      - artifacts/firmware_requirements.md
      - artifacts/interface_contract.md
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/USER/src/fw_core.c
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/USER/src/measure.c
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/USER/src/debug_trace.c
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/test/host_sensor_core_test.c
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/test/host_fw_core_pure_check.c
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/test/host_measure_flow_check.c
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/test/host_debug_trace_check.c
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/test/build_test.sh
    acceptance:
      - "T1 向量：30.0→30.8 暗不报；30.0→30.9 暗不报；30.0→31.0 暗报；30.0→31.0 明/未启用不报；30.0→29.0 暗不报；34.0→35.0 暗报、明不报；无前值 35.0 不报、35.1 任意光照报。"
      - "T2：首次成功 P 行 rq=0/s=1/t/h=冻结样本；失败重试期间组帧入参逐次相同、帧字节不变；新触发不覆盖；用尽放弃不伪造成功；P 行 ≤96 B 且仅整数。"
      - "T3：正常 mock 下 BOOT/VDD/IOTEST/IOSIG/BUS/S/G/P 字节不变；TXE 卡死/TXBUSY 卡死两组均在有限循环返回并完成关闭。"
      - "失败语义：温湿度失败周期不新建/不覆盖快照、不发送、不推进前值；SENSOR_DEBUG_UART=0 时不引入 UART 符号。"
      - "证据类别：宿主自检输出与构建 0 Error；真实目标 P 行/节拍证据由实板任务取得，不以宿替代。"
    metadata:
      increment: FW-REG-REPORT
      title: T1/T2/T3 规范向量与格式化回归
      priority: highest
      owner: firmware_engineer
      depends_on:
        - FW-REG-ASBUILT
      as_built_state: implemented_current_source
      evidence_class: host_self_test_and_build
      external_prereq: none
      forbidden: []
      do_not_touch:
        - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/test/*_verify_ev.c
        - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/test/mock_*_ev/
        - CH592EVT/EVT/EXAM/BLE/beiwov2/
        - dengbei_care/

  - objective: >-
      按设计 §6.2 落地无光判据形制 LIGHT-DEF-2，并保持判据未启用：在 sensor_config.h 删除
      LIGHT_DARK_REF_CODE / LIGHT_DARK_CALIBRATED，新增唯一常量 LIGHT_DARK_THRESHOLD_CODE（0 =
      未启用；1..4095 = 阈值）；把 light_is_dark(mean, valid, threshold) 改为 valid && threshold!=0 &&
      mean >= threshold（整数比较、边界相等为暗、每笔独立无滞回）；light.c 的 valid 改为
      adc_ok && (阈值 != 0)；同步更新 light.h/fw_core.h 注释与实现侧自检向量。
      本任务不启用判据、不改阈值取值、不改采样/时序/格式/空口/BLE。
    input_refs:
      - artifacts/firmware_design.md
      - artifacts/firmware_requirements.md
      - evidence/firmware_design_lightdef/lightdef_analysis.txt
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/USER/inc/sensor_config.h
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/USER/src/fw_core.c
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/USER/inc/fw_core.h
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/USER/src/light.c
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/USER/inc/light.h
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/test/host_fw_core_pure_check.c
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/test/host_sensor_core_test.c
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/test/host_light_check.c
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/test/build_test.sh
    acceptance:
      - "形制向量：threshold=0 且 valid=true → dark=false；threshold=1、mean=0 → false、mean=1 → true；threshold=4095 → 仅 mean=4095 为 true；mean=threshold-1 → false、mean=threshold → true（相等为暗）；valid=false → 任意 threshold/mean 均 false；threshold=0 与 valid=false 任一成立即不得判暗。"
      - "接线：light_sample 的 valid = adc_ok && (LIGHT_DARK_THRESHOLD_CODE != 0)；dark = light_is_dark(mean, valid, LIGHT_DARK_THRESHOLD_CODE)；ADC 全超时仍 adc_ok=false → valid=false → dark=false，不合成满量程。"
      - "未启用等价性：LIGHT_DARK_THRESHOLD_CODE=0 时，S 行 V=0 D=0、r=0、s=0、y=0 与 as-built 一致；采样时序、行长度（≤96 B）、字段集合/顺序、G/P 行条件、433/BLE 布局、资源占用均不变。"
      - "旧宏清除：源码与实现侧测试中不再出现 LIGHT_DARK_REF_CODE / LIGHT_DARK_CALIBRATED；不保留静默同义别名。"
      - "构建：Keil rebuild + gcc/build.sh + 宿主机 test/build_test.sh 全部 0 Error；产物摘要变化必须有说明并重新绑定证据。"
      - "跨角色影响登记：不改 test/*_verify_ev.c 与 test/mock_*_ev/；在实现记录中列出需由验证角色同步的资产（host_fw_core_verify_ev.c 的 1/3 断言、host_vdd_verify_ev.c 的旧宏引用），不得以修改验证资产或绕过其断言来让本任务通过。"
      - "证据类别：源码差异、构建日志、宿主向量输出；不声称无光判定已可用。"
    metadata:
      increment: FW-LIGHT-DEF2-MECH
      title: 无光判据形制落地（LIGHT-DEF-2，门禁关闭）
      priority: high
      owner: firmware_engineer
      depends_on:
        - FW-REG-REPORT
      as_built_state: criterion_form_pending_replacement
      evidence_class: host_self_test_and_build
      external_prereq: none
      forbidden:
        - 设置非 0 的 LIGHT_DARK_THRESHOLD_CODE
        - 引入滞回、温补、自适应基线或跨周期光照状态
        - 修改 433/BLE 布局、S/G/P 行格式或采样节拍
      do_not_touch:
        - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/test/*_verify_ev.c
        - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/test/mock_*_ev/
        - CH592EVT/EVT/EXAM/BLE/beiwov2/
        - dengbei_care/

  - objective: >-
      在当前构建与真实目标上做被动观测，不施加任何温度或光照刺激：用 COM43/9600 8N1 连续采集
      ≥3 个 3 分钟周期，确认 q=1、k 步长 3、o=8、每行 ≤96 B、无杂散字节/NUL、采样间期无输出；
      记录每周期 a/n/x/V/D 与 t/h，形成判据审查与后续启用对比的现场基线；出现失败周期时取 S+G
      并保持失败语义（不上报、不推进前值、不构造 0）。观测环境保持设备正常使用状态，不为取数
      改变光强、遮光或温度。
    input_refs:
      - artifacts/firmware_design.md
      - artifacts/firmware_requirements.md
      - artifacts/firmware_feasibility_current.md
      - evidence/firmware_design_lightdef/lightdef_analysis.txt
      - evidence/ev030/tool_results.txt
      - evidence/ev031/tool_results.txt
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/USER/src/measure.c
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/USER/src/debug_trace.c
    acceptance:
      - "采集：COM43/9600 8N1 有界采集 ≥3 个连续周期（单窗口不足时允许多窗口，须记录窗口起止与字节数）。"
      - "字段：全部周期 q=1；t 在 -400..1250、h 在 0..1000；o=8；a 落在 n..x 之间；每行 ≤96 B 且以 CRLF 结束；窗口内无杂散字节/NUL；采样间期无输出。"
      - "节拍：相邻观测周期 k 差值恒为 3；同一周期不出现两行 S。"
      - "判据状态：记录 V/D（判据未启用时应为 V=0 D=0），并记录 a 数值供设计 §6.2 复核；不得把 V=0 D=0 解释为“已识别有光”。"
      - "失败路径：若出现 q=0，须取得同周期 G 行并核对结果码/ACK/重读/重测/raw，确认不报/不推进/不构造 0；不得为消除失败而改判据或降低断言。"
      - "身份：记录构建摘要、下载校验（若本次涉及下载）与板件标识（若可取得）；不得用历史 COM42 或旧镜像证据替代。"
      - "禁止：不以调温、改变光强、遮光/照射、拆装外壳作为取数手段；不在本任务内做功耗测量。"
      - "证据类别：COM43 原始字节 + 解析输出 + 时间/窗口记录；数字行不证明模拟电气或照度。"
    metadata:
      increment: FW-OBS-PASSIVE
      title: 当前构建被动观测（COM43，无刺激）
      priority: high
      owner: firmware_engineer_with_embedded_test
      depends_on:
        - FW-REG-ASBUILT
      as_built_state: capture_pending
      evidence_class: current_build_real_board_capture
      external_prereq:
        - 传感器 Keil 工程构建与下载授权（工程保存的调试器/Flash 算法）
        - COM43/9600 8N1 有界采集入口
      forbidden:
        - 调节温度
        - 改变光强或以遮光/照射作为测试手段
        - 功耗/电流测量
      do_not_touch:
        - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/test/*_verify_ev.c
        - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/test/mock_*_ev/
        - CH592EVT/EVT/EXAM/BLE/beiwov2/
        - dengbei_care/

  - objective: >-
      在无光判据的形制与数值获得正式接受、且已取得设计 §6.2(5) 要求的被动双态证据后，把
      LIGHT_DARK_THRESHOLD_CODE 从 0 回填为接受值（候选 3590，可用带 (3514, 3660]），重建并在真实
      目标上采集：受光周期 V=1 D=0、覆盖/无光周期 V=1 D=1、ADC 全超时 V=0。证据不足或出现分离
      不足（受光均值 ≥ T、覆盖均值 < T）时，回退 T=0 并登记为需求/硬件决策，不挪阈值凑通过。
    input_refs:
      - artifacts/firmware_design.md
      - artifacts/firmware_requirements.md
      - artifacts/interface_contract.md
      - evidence/firmware_design_lightdef/lightdef_analysis.txt
      - evidence/ev024/capture_analysis.txt
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/USER/inc/sensor_config.h
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/USER/src/light.c
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/USER/src/fw_core.c
    acceptance:
      - "前置：存在对判据形制与数值的接受记录（含 IC-002 §4.2 同步）；缺少接受记录时本任务不得执行，只记录未执行及缺项。"
      - "证据：T 非 0 之前须已有同板件/同构建/同摆放的受光被动样本 mean<T 与覆盖被动样本 mean>=T，来自不同周期、o=8、n/x 未饱和；观测未以改变光强/遮光为测试手段。"
      - "启用后：受光周期实测 S 行 V=1 D=0（记录 a 与阈值余量）；覆盖/无光周期 V=1 D=1；ADC 全超时（可用宿主角或实际超时）V=0 D=0；恰好 mean==T 判暗。"
      - "边界传播：启用后 30.0→30.9℃ 覆盖态不报、30.0→31.0℃ 覆盖态可报、受光态升温不报、>35.1℃ 任意光照报（宿主向量 + 实板可观测性说明；本阶段不做升温刺激）。"
      - "回退规则：若受光均值 ≥ T 或覆盖均值 < T，或双态证据缺失，保持/恢复 T=0 并登记分离不足与所需决策；不得改阈值、加滞回/温补或放宽判据。"
      - "重建与证据：回填后 rebuild 0 Error，下载校验须见 Verify OK，证据绑定新构建摘要 + COM43 原始字节；不得沿用历史 axf 摘要。"
      - "禁止：不以调温、改变光强、遮光/照射、功耗测量取得证据；不以宿主结果冒充实板观测。"
    metadata:
      increment: FW-LIGHT-DEF2-ENABLE
      title: 无光判据数值接受后启用与被动双态取证
      priority: medium
      owner: firmware_engineer_with_embedded_test
      depends_on:
        - FW-LIGHT-DEF2-MECH
        - FW-OBS-PASSIVE
      as_built_state: blocked_on_criterion_acceptance
      evidence_class: current_build_real_board_capture
      external_prereq:
        - 判据形制与数值的接受记录（需求/架构），并同步 IC-002 §4.2
        - 正常使用状态下的被动覆盖/无光观测窗口（不得人为改变光强或遮光）
        - 传感器 Keil 工程构建与下载授权、COM43 采集入口
      forbidden:
        - 调节温度
        - 改变光强或以遮光/照射作为测试手段
        - 调整阈值以拟合观测或加入滞回/温补
        - 功耗/电流测量
      do_not_touch:
        - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/test/*_verify_ev.c
        - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/test/mock_*_ev/
        - CH592EVT/EVT/EXAM/BLE/beiwov2/
        - dengbei_care/

  - objective: >-
      补齐上电诊断身份证据：先打开 COM43 捕获，再在窗口内复位/上电，取得 BOOT（fw/uid/rst/uart）、
      VDD、IOTEST、IOSIG、BUS 各一次并与构建/下载身份交叉核对。按用户补充条件评估用已连接的
      CW-DAPLink + pyocd 作为复位入口：先确认 pyocd 能识别目标，再评估能否在 COM43 采集期间执行
