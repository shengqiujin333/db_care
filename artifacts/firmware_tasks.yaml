items:
  - "新增 sensor_config.h 作为唯一配置点：定义 PB04/PB05 引脚与 ADC 通道、GXHT40 地址/命令/重试/等待参数、光照明暗阈值与滞回、3 分钟采样计数值、0.9℃ 下降与 35.0℃ 超温上报常量；加入该头文件后工程仍可交叉编译。"
  - "扩展 sf_i2c 总线原语：提供不带寄存器地址的命令写（START→地址+W→命令→STOP）与连续读（START→地址+R→N 字节→NACK→STOP），并把从机 ACK 失败作为可判断的返回值；既有 i2c 函数语义与调用方式不变。"
  - "实现 GXHT40 驱动 gxht40.c/.h：上电探测 0x44/0x45 地址（8 位写 0x88/0x8A、读 0x89/0x8B），发送 0xFD 高重复率测量命令，按 tMEAS 上限等待后读回 6 字节，用 CRC-8（poly 0x31、init 0xFF、无反转、xorout 0x00）分别校验温度字与湿度字，输出 temp_x10（int16，-400..1250）与 hum_x10（uint16，0..1000，越界截断）；失败返回失败码且不修改输出。"
  - "实现光照通路 light.c/.h：采样时 PB05 输出高、稳定延时后用 PB04/AIN11 多次取样求均值，按配置阈值与滞回输出 DARK/LIT（无光=读数≥进入阈值），采样结束 PB05 置低。"
  - "在 fw_core.c 中实现并保持不依赖 MCU 寄存器的纯逻辑：fw_crc8_gxht 满足参考向量 CRC(0xBEEF)=0x92；GXHT40 原始字到 x10 的整数换算含负温与 0-100%RH 截断；light_code_is_dark 的滞回判定；sensor_decide_report 判定 report=((prev_temp_x10-cur_temp_x10)>9 且 DARK) 或 (cur_temp_x10>350)，无前一有效温度时下降分支恒为假。"
  - "改造 measure.c 采样流程：每个采样周期先取光照再取温湿度；GXHT40 读 NACK 与 CRC 错按配置上限有界重试；整周期失败时不上报、不更新前一有效温度、不构造 0 值；成功后更新前一有效温度与最近有效湿度。"
  - "将采样节拍改为 3 分钟：RTC 1 分钟中断累计到配置的 3 次才置采样标志，一个采样周期内只执行一次测量，并移除原小时上报与首样本强制上报逻辑。"
  - "实现条件上报：满足 sensor_decide_report 时调用 encode_frame10(uid, temp_x10, hum_x10) 组 10 字节帧并经 app_um2005C_send_data_timeout 有界发送，帧布局、字节序与 Feistel 加密保持不变，仅在发送成功后清除待上报状态，发送失败按上限重试后放弃本轮。"
  - "退役与新硬件冲突的旧通路：从工程与构建中移除 hall/OPTCFG/params/history 模块及其对 PB04/PB05/PB06 的初始化，移除 GPIOB 霍尔 EXTI 分支与 LPTIM 中的 OPTCFG 分支；PB04 仅作 AIN11 模拟输入、PB05 仅作光照供电输出、PB06 不外驱动。"
  - "更新宿主机纯逻辑测试 test/host_sensor_core_test.c 与 test/build_test.sh：覆盖 CRC-8 参考向量、换算边界（负温、0%/100% 截断）、光照阈值与滞回、上报判定边界（恰好 0.9℃、恰好 35.0℃、无前值、非暗、失败不更新），移除已退役的 OPTCFG/params 用例，脚本在本机运行通过。"
  - "交叉编译验证传感器工程：执行 gcc/build.sh 完成编译与链接并生成 elf/hex/bin，RAM 与 Flash 占用不超过 4KB/64KB，且 MDK/IAR 工程源文件列表与新增、移除的源文件保持一致。"
  - "核查网关固件（CH592 beiwov2）兼容性：确认 decode_frame10 取 temp=p[4..5]、hum=p[6..7]，BLE 每设备 8 字节记录为 id|hum_be|temp_be 且与 Android parsePlainFrame 的 u16be@4/s16be@6 一致；一致则不改代码并记录核对结论，不一致才按接口契约对齐。"
