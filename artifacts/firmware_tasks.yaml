items:
  - objective: >-
      更正传感器条件上报判定为需求规定的升温方向与严格边界：判定语义为“本次比上次升高超过 0.9℃ 且无光，或本次严格超过 35.0℃ 才上报”；report 仅在温湿度本周期均有效时成立，
      判定式冻结为：report = int32(cur_temp_x10) > 350，或（have_prev 且 int32(cur_temp_x10)-int32(prev_temp_x10) > 9 且光照有效且 dark）；无前值时仅超温分支可用；
      差值必须用 int32；恰好 +0.9℃（差值 9）、恰好 35.0℃ 且无升温、任何降温都不得触发；恰好 35.0℃ 仍可经升温分支上报；无前一有效温度时只允许超温分支；
      光照无效或非无光只关闭升温分支，不关闭超温分支。判定常量在唯一配置点 sensor_config.h 中以 SENSOR_REPORT_RISE_X10（=9）与 SENSOR_REPORT_HIGH_X10（=350）维护，
      删除旧的 SENSOR_REPORT_DROP_X10/降温语义；不得改动空口/BLE 布局、S 行格式、采样节拍、前值推进语义（成功才推进、失败不推进）与冻结/发送行为。
      同步更新实现侧自有宿主机自检（host_sensor_core_test.c、host_fw_core_pure_check.c 及必要的流程自检），使断言改为升温/严格边界；不得修改验证角色自有的 test/*_verify_ev.c、test/mock_*_ev/ 与 evidence/embedded_verify_*.py。
      交付需能由 MDK/IAR/gcc 构建入口重建，并给出宿主机自检与构建结果。
    input_refs:
      - readme.txt
      - artifacts/firmware_design.md
      - artifacts/firmware_requirements.md
      - artifacts/interface_contract.md
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/USER/src/fw_core.c
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/USER/inc/fw_core.h
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/USER/inc/sensor_config.h
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/USER/src/measure.c
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/test/host_sensor_core_test.c
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/test/host_fw_core_pure_check.c
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/test/build_test.sh
    acceptance:
      - "正常向量：30.0→30.8℃（D=8）暗、有前值 → 不上报；30.0→30.9℃（D=9）暗 → 不上报；30.0→31.0℃（D=10）暗 → 上报；30.1→31.0℃（D=9）暗 → 不上报。"
      - "方向向量：30.0→29.0℃（D=-10）暗、有前值 → 不上报；任何本次低于上次的组合都不得触发升温分支。"
      - "边界向量：34.0→35.0℃ 暗、有前值 → 上报；34.0→35.0℃ 明/光照无效 → 不上报；无前值且 35.0℃ → 不上报；无前值且 35.1℃、明或光照无效 → 上报；34.0→34.9℃ 暗 → 不上报。"
      - "异常/极端输入：int16 极值（32767 与 -32768）差值不溢出且结果符合 32 位算术；非暗只关闭升温分支，超温仍独立生效。"
      - "接口与常量：sensor_config.h 只保留单一组上报常量（RISE=9、HIGH=350），源码与注释中不再存在 DROP/降温判定；S 行字段集合与顺序、433/BLE 布局、前值推进语义、失败不推进语义均未改变。"
      - "测试资产边界：实现侧自有宿主机自检已更新并通过；验证角色自有的 test/*_verify_ev.c、test/mock_*_ev/、evidence/embedded_verify_*.py 未被修改（其旧断言同步需求记录在交付说明中）。"
      - "证据类别：宿主机自检逐项输出（含九组规范向量与边界）与构建入口 0 Error 记录；真实目标上的 r/s 边界证据属于后续实板观测，不得用宿主机结果冒充。"
    metadata:
      increment: T1
      title: 条件上报判定更正（升温方向 + 严格 35.0℃ 边界）
      priority: highest
      depends_on: []
      files_expected:
        - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/USER/src/fw_core.c
        - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/USER/inc/sensor_config.h
        - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/test/host_sensor_core_test.c
        - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/test/host_fw_core_pure_check.c
      evidence_class: host_self_test_and_build
      external_prereq: none
      do_not_touch:
        - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/test/*_verify_ev.c
        - CH592EVT/EVT/EXAM/BLE/beiwov2/
        - dengbei_care/

  - objective: >-
      为条件上报补齐“待上报样本冻结 + 可观测 P 行”：在判定触发且当前没有待上报样本时，把本周期温湿度冻结为 report_temp_x10/report_hum_x10 并置 report_req；
      组帧 encode_frame10 只允许读冻结快照，不得再读会随新采样推进的 s_prev_temp_x10/s_last_hum_x10；待上报未清除期间新的触发不得覆盖原冻结样本；
      发送成功才清除并复位重试计数，按 SENSOR_RF_TX_RETRY 用尽则放弃本轮且不得伪造成功；重试期间（含若待上报跨越采样周期）帧的 ID/温度/湿度/CRC 必须逐字节一致；
      帧布局、字节序、单位、Feistel 加密与 433 超时参数均不变。为观测冻结事实，在调试通道增加一条 P 行（仅本周期产生上报判定 r=1 或发生过至少一次发送尝试时打印，紧跟 S 行；若同周期有 G 行则在 G 之后），
      字段固定为 P rq=<0|1> s=<0|1|2> y=<0..3> t=<冻结温度 x10> h=<冻结湿度 x10>，其中 t/h 必须是本周期组帧实际使用的值、rq 为本条 P 行打印时是否仍待上报（1=本轮未结束/仍待发，0=已清除或已放弃）；
      P 行 ≤96 字节（含 CRLF）、仅整数、不改变 report_req/前值/快照/发送结果、不进入空口或 BLE；SENSOR_DEBUG_UART=0 时全部为空实现。S 行与既有 VDD/IOTEST/IOSIG/BUS/G 行格式逐字节不变。
      同步实现侧自检：mock 发送桩逐次记录组帧入参，验证重试期间与跨采样后帧内容不变、新触发不覆盖、用尽放弃不假成功、P 行字段与快照一致且行预算内；不得修改验证角色自有的 test/*_verify_ev.c。
    input_refs:
      - readme.txt
      - artifacts/firmware_design.md
      - artifacts/firmware_requirements.md
      - artifacts/interface_contract.md
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/USER/src/measure.c
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/USER/inc/measure.h
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/USER/src/debug_trace.c
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/USER/inc/debug_trace.h
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/USER/src/main.c
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/test/host_measure_flow_check.c
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/test/host_debug_trace_check.c
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/test/build_test.sh
    acceptance:
      - "正常路径：触发周期冻结当次 t/h；组帧入参与该周期采样值一致；首次发送成功则 report_req=0、retry=0，P 行显示 rq=0、s=1、t/h=冻结样本。"
      - "重试路径：强制首次及后续发送失败，重试期间的编码入参逐次相同（t/h/帧字节不变），不因新采样或前值推进而改变；用尽后 report_req=0 且不出现“成功”结果。若首次失败，该周期 P 行按打印时状态显示 rq=1、s=2、y>=1，仅表示本轮未结束，不得记为最终失败；宿主序列须继续验证后续成功或耗尽后的最终状态。"
      - "覆盖路径：待上报未清除时发生新的触发，原冻结样本不被覆盖；仅发送成功或用尽放弃后，下一次触发才写入新快照。"
      - "接口不变：433 明文仍为 uid4/T s16LE/RH u16LE/CRC16LE 共 10 B；不新增字段；S 行与既有诊断行字节不变；P 行最坏不超过 96 字节且仅含整数/十进制。"
      - "失败/关闭路径：温湿度失败周期不新建、不覆盖快照、不发送；SENSOR_DEBUG_UART=0 时 P 行无输出且不引入 UART 符号。"
      - "副作用：P 行打印前后 report_req、前值、冻结快照、发送结果均无变化；打印不进入 433/BLE/平台载荷。"
      - "证据类别：宿主机流程/格式化自检输出（含重试与跨采样序列）与构建 0 Error 记录；真实目标 P 行证据由后续实板观测取得，不得用宿主 mock 冒充。"
    metadata:
      increment: T2
      title: 待上报冻结快照与 P 观测行
      priority: high
      depends_on:
        - T1
      files_expected:
        - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/USER/src/measure.c
        - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/USER/inc/measure.h
        - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/USER/src/debug_trace.c
        - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/USER/inc/debug_trace.h
        - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/test/host_measure_flow_check.c
        - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/test/host_debug_trace_check.c
      evidence_class: host_self_test_and_build
      external_prereq: none
      do_not_touch:
        - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/test/*_verify_ev.c
        - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/test/mock_*_ev/
        - CH592EVT/EVT/EXAM/BLE/beiwov2/
        - dengbei_care/

  - objective: >-
      消除 UART1 调试通道的无界等待，使诊断故障不得阻塞采样与深睡：把 debug_trace.c 中 trace_putc 等 TXE、debug_trace_flush_close 等 TXE/TXBUSY 的 while 循环改为带计数上限的有界等待；
      上限常量集中放在唯一配置点 sensor_config.h，取值按 9600 8N1 下每字符约 1.04 ms、单行 ≤96 B 约 100 ms 推算并保留余量。正常硬件路径下所有既有行（BOOT/VDD/IOTEST/IOSIG/BUS/S/G）与新增 P 行的输出字节必须保持不变；
      等待超时时放弃本行剩余输出并继续执行 UART1 关闭流程（复位/关闭 UART1、PA05/PA06 置输入），返回主循环继续采样/发送/深睡；超时不得修改 report_req、前值、冻结快照、发送结果，不得复位 GPIOA/关 GPIOA 时钟，不得改动 PA03/PA04/PA07/PA08。
      同步实现侧自检：用 mock UART 让 TXE 永不置位、TXBUSY 永不清零，验证打印函数在有限循环内返回、关闭流程完成、后续采样/发送流程仍可继续；正常 mock 下既有格式化断言逐字节通过。不得修改验证角色自有的 test/*_verify_ev.c。
    input_refs:
      - artifacts/firmware_design.md
      - artifacts/firmware_requirements.md
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/USER/src/debug_trace.c
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/USER/inc/debug_trace.h
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/USER/inc/sensor_config.h
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/test/host_debug_trace_check.c
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/test/mock_trace/
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/test/build_test.sh
    acceptance:
      - "正常路径：在 TXE/TXBUSY 正常翻转的 mock 下，BOOT/VDD/IOTEST/IOSIG/BUS/S/G/P 各行字节与冻结格式逐字节一致，现有格式化自检全部通过。"
      - "异常路径：TXE 永不置位时，任意行打印在有限循环内返回；TXBUSY 永不清零时，flush/close 在有限循环内完成关闭并返回；不出现无界 while/TXE/TXBUSY 等待。"
      - "业务隔离：等待超时场景下 report_req、前值、冻结快照、发送结果保持不变；关闭后 UART1 外设关闭、PA05/PA06 为输入、GPIOA 未被复位、PA03/PA04/PA07/PA08 未被改写。"
      - "可配置：等待上限只来自 sensor_config.h 的单一常量，文件内不散落魔法数；SENSOR_DEBUG_UART=0 时仍为空实现且不引入 UART 符号。"
      - "证据类别：宿主机 mock 自检（正常/标志卡死两组）输出与构建 0 Error 记录；真实硬件下的排空行为由后续实板观测核对，不得以宿主模拟代替。"
    metadata:
      increment: T3
      title: 调试发送等待有界化
      priority: high
      depends_on: []
      files_expected:
        - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/USER/src/debug_trace.c
        - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/USER/inc/sensor_config.h
        - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/test/host_debug_trace_check.c
        - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/test/mock_trace/
      evidence_class: host_self_test_and_build
      external_prereq: none
      do_not_touch:
        - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/test/*_verify_ev.c
        - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/USER/src/light.c
        - CH592EVT/EVT/EXAM/BLE/beiwov2/
        - dengbei_care/

  - objective: >-
      用当前交付构建在真实目标上定位并修复 GXHT40 温湿度采集失败，恢复每 3 分钟采样周期的有效温湿度读数。先取得并记录一手判别证据：
      受测提交与构建产物摘要、下载校验结果、COM43@9600 8N1 上电段（BOOT/VDD/IOTEST/IOSIG/BUS）与各周期 S 行（失败周期附 G 行）；证据必须能区分“总线空闲电平异常 / 任何地址无 ACK / 地址有 ACK 但读失败或 CRC 错 / 量程无效 / 偶发”这些失败环节。
      保留多个竞争假设（U9 焊点连通性或器件本体、总线电气与上拉、固件软 I2C 速率/建立保持/上电余量/引脚映射、供电瞬态），按证据逐项收敛，不得预设单一结论，不得把 MCU 侧 VDD 正常当作 U9 焊点导通的证明。
      允许的固件侧修复限于：在器件手册范围内调整软 I2C 半位延时/总线速率、上电与转换等待余量、探测/重试/总线恢复的有界策略、按网表核对并修正引脚与地址配置；必须保留双字 CRC-8、整数换算与有效域、有界重读/整帧重测，
      周期路径不得使用软复位 0x94 或加热命令，不得为通过而放宽或绕过 CRC/量程/判据；任何失败周期仍不上报、不推进前一有效温度、不构造 0 值、不冻结快照，下一周期仍重探 0x44/0x45 并做有界总线恢复。
      若一手证据指向板级/器件原因，必须提交可复现的判别证据、已尝试的固件侧措施及其结果、所需外部处置与复测条件，不得宣告不可修复，也不得改判据/伪造读数；任务只有在真实目标连续多个 3 分钟周期 q=1 且读数有效后才可视为通过。
    input_refs:
      - readme.txt
      - artifacts/firmware_design.md
      - artifacts/firmware_requirements.md
      - artifacts/interface_contract.md
      - artifacts/system_analysis.md
      - gxht40.pdf
      - sensor_hardware/pstxnet.dat
      - sensor_hardware/MAIN_BOARD.BOM
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/USER/src/gxht40.c
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/USER/src/sf_i2c.c
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/USER/src/measure.c
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/USER/src/debug_trace.c
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/USER/inc/sensor_config.h
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/test/host_gxht40_check.c
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/test/host_sf_i2c_bus_check.c
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/test/host_measure_flow_check.c
      - evidence/test.md
    acceptance:
      - "证据先行：当前构建下载后，COM43 上电段包含 BOOT/VDD/IOTEST/IOSIG/BUS 各一次；采集窗口跨至少 3 个采样机会；每条失败周期 S 行后紧跟 G 行；原始字节、构建摘要、下载校验记录与板件 UID 一并入库。"
      - "判别完整：报告明确给出本轮失败环节（空闲电平位、各地址 ACK 集合、结果码、读重读/整帧重测次数、原始 6 字节）以及被排除/保留的假设；不得只写“仍失败”。"
      - "成功判据（唯一通过条件）：真实目标连续至少 3 个 3 分钟周期 S 行 q=1，t 在 -40.0..125.0℃、h 在 0..100.0%RH 且与环境相符；相邻 k 差值为 3；读数稳定，不是偶发单周期。"
      - "失败语义：所有失败周期 q=0 且不上报、不推进前值、不构造 0 值、不冻结快照；下一周期仍可见两地址重探与有界总线恢复；不得使用 0x94 或加热命令。"
      - "修复边界：双字 CRC-8、整数换算、有效域、有界重读/重测未被放宽或绕过；速率/等待/地址变更仅来自单一配置点；空口/BLE 布局、S 行格式不变。"
      - "异常与硬件分支：若证据指向 U9 焊点/器件/总线电气，提交可复现的判别证据、所需外部处置与复测条件，并保持失败路径不变；不得宣告不可修复、不得把假设写成实测事实、不得以 hardware 原因关闭任务。"
      - "跨链路（在触发上报的周期）：手机端显示的温湿度与该周期 S 行/冻结 P 行样本一致；不一致时登记为跨链路问题，不得只改固件期望值。"
      - "证据类别：当前构建的实板原始捕获（串口字节）、下载校验记录、构建产物摘要、宿主机驱动/流程自检结果；历史 EV-017 及 COM42 记录只能作背景。"
