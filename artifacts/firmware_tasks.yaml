items:
  - objective: >-
      确认当前 as-built 固件候选（HEAD ef5caa6）是本次设计基线：重建传感器 Keil 工程并复跑实现侧宿主自检，
      核对 T1 升温判定/严格 35.0℃、T2 冻结快照与 P 行、T3 UART 有界等待、T4/F-1 GXHT40 修复均已存在，
      且空口/BLE 布局、S/G/P 行格式、采样节拍、前值推进、失败不推进、未标定门禁均未改变。
      本任务不要求重写已符合项；只有回归向量失败时才允许做最小修复。不得修改验证角色自有的
      test/*_verify_ev.c、test/mock_*_ev/ 或 evidence/embedded_verify_*.py。
    input_refs:
      - readme.txt
      - artifacts/firmware_feasibility.md
      - artifacts/firmware_design.md
      - artifacts/firmware_requirements.md
      - artifacts/interface_contract.md
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/USER/src/fw_core.c
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/USER/src/measure.c
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/USER/src/debug_trace.c
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/USER/src/gxht40.c
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/USER/inc/sensor_config.h
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/MDK/Project.uvprojx
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/test/build_test.sh
    acceptance:
      - "构建：Keil rebuild 0 Error / ≤1 既有 warning（main.c 空循环体）；Code=25964 RO=656 RW=116 ZI=1676；Project.axf md5=a3b08774e764f174eac318f6771d0c42、Project.hex md5=546ce20a718fa69b40177cce0145f4b5；若源文件无功能修改，重建产物应与该摘要一致。"
      - "T1：sensor_decide_report 为 cur>350 或（have_prev 且 int32(cur-prev)>9 且 dark）；+0.9℃ 不报、+1.0℃ 报、降温不报、恰好 35.0℃ 可经升温分支上报、无前值仅超温；int16 极值不溢出。"
      - "T2：触发且无待上报时冻结 {temp,hum}；组帧只读冻结快照；重试/跨采样期间帧字节不变；新触发不覆盖；仅成功清除；P 行 rq/s/y/t/h 为组帧实际值且 ≤96 B。"
      - "T3：TXE 永不置位、TXBUSY 永不清零时，打印与关闭在有限循环内返回；超时不改 report_req/前值/冻结快照/发送结果；不复位 GPIOA、不改 PA03/PA04/PA07/PA08。"
      - "T4/F-1：GXHT40 0x44/0x45 探测、0xFD、6 B、双 CRC、x10 换算/有效域、失败后重探与有界恢复仍在；S 行 p/H 为判定前快照（首样本 H=0 p=0），不因新采样改变。"
      - "接口/退役：433 明文 10 B、BLE 8 B 布局不变；无 hall/optcfg/params/history 活动引用；PB04=AIN11、PB05=光照供电、PB06 未使用；S/G/P/BOOT 行格式不变。"
      - "证据类别：当前构建日志、产物摘要、实现侧宿主自检输出；不把宿主结果冒充实板/跨链路通过。"
    metadata:
      increment: FW-REG-ASBUILT
      title: as-built 候选回归与不变量核对
      priority: highest
      owner: firmware_engineer
      depends_on: []
      as_built_state: implemented_current_source
      evidence_class: host_self_test_and_build
      external_prereq: none
      do_not_touch:
        - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/test/*_verify_ev.c
        - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/test/mock_*_ev/
        - CH592EVT/EVT/EXAM/BLE/beiwov2/
        - dengbei_care/

  - objective: >-
      回归 T1/T2/T3 的规范向量与格式化行为，确认当前源码在该范围内无需功能改动：
      IC-002 九组上报向量、待上报冻结/重试/跨采样/不覆盖、P 行字段与 96 B 预算、
      UART TXE/TXBUSY 卡死有界返回、S/G/P 既有行逐字节格式。若任一向量失败，按最小改动修复并复跑；
      不得通过改判据、改期望、降低断言或修改验证角色资产来通过。
    input_refs:
      - artifacts/firmware_design.md
      - artifacts/firmware_requirements.md
      - artifacts/interface_contract.md
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/USER/src/fw_core.c
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/USER/src/measure.c
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/USER/src/debug_trace.c
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/test/host_sensor_core_test.c
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/test/host_fw_core_pure_check.c
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/test/host_measure_flow_check.c
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/test/host_debug_trace_check.c
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/test/build_test.sh
    acceptance:
      - "T1 向量：30.0→30.8 暗不报；30.0→30.9 暗不报；30.0→31.0 暗报；30.0→31.0 明/无效不报；30.0→29.0 暗不报；34.0→35.0 暗报、明不报；无前值 35.0 不报、35.1 明/无效报。"
      - "T2：首次成功 P 行 rq=0/s=1/t/h=冻结样本；失败重试期间组帧入参逐次相同、帧字节不变；新触发不覆盖；用尽放弃不伪造成功；P 行 ≤96 B 且仅整数。"
      - "T3：正常 mock 下 BOOT/VDD/IOTEST/IOSIG/BUS/S/G/P 字节不变；TXE 卡死/ TXBUSY 卡死两组均在有限循环返回并完成关闭。"
      - "失败语义：温湿度失败周期不新建/不覆盖快照、不发送、不推进前值；SENSOR_DEBUG_UART=0 时 P 行空实现且不引入 UART 符号。"
      - "证据类别：宿主自检输出与构建 0 Error；真实目标 P 行/节拍证据由后续实板任务取得，不以宿替代。"
    metadata:
      increment: FW-REG-REPORT
      title: T1/T2/T3 规范向量与格式化回归
      priority: highest
      owner: firmware_engineer
      depends_on:
        - FW-REG-ASBUILT
      as_built_state: implemented_current_source
      evidence_class: host_self_test_and_build
      external_prereq: none
      do_not_touch:
        - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/test/*_verify_ev.c
        - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/test/mock_*_ev/
        - CH592EVT/EVT/EXAM/BLE/beiwov2/
        - dengbei_care/

  - objective: >-
      在当前交付构建和真实目标上复核 GXHT40 采集：连续 ≥3 个 3 分钟周期 S 行 q=1、t/h 在有效域、
      k 步长为 3；如出现失败周期，取得 S+G 与 BUS/IOTEST/IOSIG/VDD 可判别证据并保持失败语义
      （不上报、不推进前值、不构造 0、不冻结）。当前构建已在 0x44 取得 ACK/CRC/q=1，
      不重复旧 EV-017 的驱动重写；不得使用 0x94/加热命令、放宽 CRC/量程或伪造读数。
    input_refs:
      - artifacts/firmware_feasibility.md
      - artifacts/firmware_design.md
      - artifacts/firmware_requirements.md
      - artifacts/interface_contract.md
      - gxht40.pdf
      - sensor_hardware/pstxnet.dat
      - sensor_hardware/MAIN_BOARD.BOM
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/USER/src/gxht40.c
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/USER/src/sf_i2c.c
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/USER/src/measure.c
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/USER/src/debug_trace.c
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/USER/inc/sensor_config.h
      - evidence/test.md
    acceptance:
      - "正常路径：当前构建真实目标连续 ≥3 个 3 分钟周期 S 行 q=1；t 在 -40.0..125.0℃、h 在 0..100.0%RH；相邻 k 差 3；读数与环境相符。"
      - "总线证据：可用 COM43 的 BUS/IOTEST/IOSIG/VDD 或已登记 fx2lafw:conn=2.32 被动 I2C 证明 0x44/0x45 中实际地址、0xFD 命令、6 B 读取与双 CRC；数字采样不证明模拟电平。"
      - "失败路径：失败周期 q=0 且不报/不推进/不构造 0；S 后 G 给出结果码/ACK/重读/重测/raw；下一周期仍重探 0x44/0x45 并有界恢复。"
      - "边界：不使用 0x94/加热命令；不放宽 CRC/量程/有效域；不改空口/BLE 布局；不因旧 EV-017 q=0 重写已工作驱动。"
      - "跨链路（触发周期）：手机显示的温湿度与该周期 S/P 冻结样本一致；不一致登记为跨链路问题。"
      - "证据类别：当前构建实板原始串口/被动 I2C、下载校验、构建摘要与 UID；历史 EV-017/COM42 只作背景。"
    metadata:
      increment: FW-REG-GXHT40
      title: GXHT40 当前构建实板回归与失败路径
      priority: high
      owner: firmware_engineer_with_embedded_test
      depends_on:
        - FW-REG-ASBUILT
      as_built_state: implemented_current_source
      evidence_class: current_build_real_board_capture
      external_prereq:
        - 传感器 Keil 工程构建与下载授权（保存的调试器/Flash 算法）
        - COM43/9600 8N1 有界采集
        - 可选：登记 fx2lafw:conn=2.32 被动 I2C（需已登记入口与接线）
      do_not_touch:
        - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/test/*_verify_ev.c
        - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/test/mock_*_ev/
        - CH592EVT/EVT/EXAM/BLE/beiwov2/
        - dengbei_care/

  - objective: >-
      完成 1/3 无光判据的标定门禁。当前现场无光：保持 LIGHT_DARK_CALIBRATED=0，记录暗态 S 的
      V/o/n/x/a/D；3914/3915/3932 仅作候选，不是正式 C_dark。只有同一板件、同一供电/建立时间/8 样本平均下
      取得受光低码与受控全遮光两组数据，且受光均值 < ceil(C_dark/3)、全遮光 3·mean >= C_dark 时，
      才允许回填 C_dark（1..4095）并置 CALIBRATED=1、重建。若现场仍无光或无受光窗口，记未执行/条件未满足，
      不得用暗态单组、满量程、旧 350/250 或估算值回填，不得改判据凑通过。
    input_refs:
      - artifacts/firmware_feasibility.md
      - artifacts/firmware_design.md
      - artifacts/firmware_requirements.md
      - artifacts/interface_contract.md
      - sensor_hardware/pstxnet.dat
      - sensor_hardware/MAIN_BOARD.BOM
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/USER/src/light.c
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/USER/inc/light.h
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/USER/src/fw_core.c
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/USER/inc/sensor_config.h
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/test/host_light_check.c
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/test/host_sensor_core_test.c
      - evidence/test.md
    acceptance:
      - "未标定门禁：当前构建 S 行 V=0、D=0、o=8（或实际成功样本数）；升温分支不触发；C_dark/CALIBRATED 保持 0/0；不得出现伪造暗态或跳过门禁。"
      - "暗态记录：记录至少 1 笔现场无光样本（V/o/n/x/a/D、时间、板件 UID、VDD）；3914/3915/3932 作为候选基线，不作为正式 C_dark。"
      - "双态条件：受光可用时记录受光 S；受控全遮光记录 a 分布（min/max/mean、取样次数、遮光方式）；受光 mean < ceil(C_dark/3) 且全遮光 3·mean >= C_dark 才可回填。"
      - "若现场无光：本任务记为条件未满足/未执行，保持 CALIBRATED=0；不得用暗态单组或估算值回填、不得改判据。"
      - "若回填：C_dark 为 1..4095 实测值，回填唯一配置点并重建；三态复测（受光 V=1 D=0、全遮光 V=1 D=1、移开恢复 D=0）；ADC 全超时仍 valid=0/dark=0。"
      - "分离不足：受光读数与 ceil(C_dark/3) 分离不足时按阈值/器件问题登记并交需求/硬件决策；不得修改判据或期望。"
      - "证据类别：当前构建 COM43 原始字节（暗态/受光/全遮光/恢复）、标定记录、配置版本与构建/下载身份；不得用宿主 mock 或历史日志替代实板标定。"
    metadata:
      increment: FW-T5-LIGHT
      title: 1/3 无光判据标定门禁（现场无光时保持未标定）
      priority: high
      owner: firmware_engineer_with_embedded_test
      depends_on: []
      as_built_state: mechanism_implemented_calibration_pending
      evidence_class: current_build_real_board_capture
      external_prereq:
        - 受光窗口与完全遮光操作条件（用户/现场）
        - 传感器 Keil 工程构建与下载授权
        - COM43 串口有界采集
      do_not_touch:
        - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/test/*_verify_ev.c
        - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/test/mock_*_ev/
        - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/USER/src/light.c
        - CH592EVT/EVT/EXAM/BLE/beiwov2/
        - dengbei_care/

  - objective: >-
      补齐上电诊断身份证据：在先打开 COM43 捕获的前提下，于窗口内复位/上电，取得
      BOOT（fw/uid/rst/uart）、VDD、IOTEST、IOSIG、BUS 各一次，并与当前构建摘要交叉核对。
      本任务不修改固件；若当前编排无法在端口打开前复位，记录“未执行及原因”，不得用后续 S 行替代。
    input_refs:
      - artifacts/firmware_feasibility.md
      - artifacts/firmware_design.md
      - artifacts/firmware_requirements.md
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/USER/src/main.c
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/USER/src/debug_trace.c
      - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/USER/inc/debug_trace.h
      - evidence/test.md
    acceptance:
      - "同一端口窗口内取得 BOOT/VDD/IOTEST/IOSIG/BUS 五行（各自一次）；BOOT 的 uid/复位来源/uart=9600 可读；不能只取得 BUS 或后续 S。"
      - "上电五行与当前构建摘要/下载校验记录对应；BUS ack 与 0x44/0x45 实际应答不矛盾；VDD 超时不得伪造。"
      - "若无法在端口打开前复位：记录未执行、实际时序和所需编排；不修改固件、不反复重试、不用后续行替代。"
      - "证据类别：COM43 原始字节、构建/下载身份；数字行不证明模拟电气。"
    metadata:
      increment: FW-DIAG-BOOT
      title: 上电五行/uid 捕获编排
      priority: medium
      owner: embedded_test_with_debug
      depends_on:
        - FW-REG-ASBUILT
      as_built_state: diagnostic_lines_implemented_capture_pending
      evidence_class: current_build_real_board_capture
      external_prereq:
        - 先开 COM43 捕获、窗口内复位/上电的测试/调试编排
      do_not_touch:
        - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/USER/src/debug_trace.c
        - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/USER/inc/debug_trace.h

  - objective: >-
      在 T5 双态标定可用后，完成真实触发与跨链路/功耗证据：受控全遮光 + 局部升温使本次比上次
      升高超过 0.9℃（或严格 >35.0℃ 分支），观察 S 的 r=1、P 冻结样本与 s=1，并在网关/手机侧
      核对同一笔 ID/温湿度/时间语义；另测严格 35.0℃ 边界、首样本无前值、采样峰值与深睡电流。
      本任务属测试/联调/硬件职责；未具备条件时记录未执行，不得用宿主 mock 或估算值代替。
    input_refs:
      - artifacts/firmware_feasibility.md
      - artifacts/firmware_design.md
      - artifacts/firmware_requirements.md
      - artifacts/interface_contract.md
      - evidence/test.md
      - evidence/software_e2e_plan.md
    acceptance:
      - "触发路径：暗 + 升温 >0.9℃ 时 r=1、P 行冻结 t/h 与组帧一致、s=1；恰好 +0.9℃ 不报、降温不报；明/光照无效只关升温分支。"
      - "超温路径：严格 >35.0℃ 在明/无效/无前值时仍报；恰好 35.0℃ 不经超温分支，但满足升温分支仍可报。"
      - "跨链路：网关/手机显示与同一周期 S/P 的 ID/温湿度一致；不一致登记为跨链路问题，不改固件期望值。"
      - "功耗：CR2032 采样峰值、深睡电流、UART/射频瞬态有实测值与条件；设计估算不作通过依据。"
      - "未执行：无受光/遮光/升温/网关/手机/电流表条件时逐项记未执行及原因，不写通过。"
      - "证据类别：串口/P 行、网关/手机同笔记录、功耗测量原始值；测试/硬件职责。"
    metadata:
      increment: FW-E2E-POWER
      title: 真实触发、跨链路与 CR2032 功耗证据
      priority: high
      owner: embedded_test_and_hardware_test
      depends_on:
        - FW-T5-LIGHT
        - FW-REG-GXHT40
      as_built_state: pending_test_conditions
      evidence_class: current_build_real_board_capture
      external_prereq:
        - 受光/全遮光/局部升温现场条件
        - 网关与手机同窗口联调
        - 电流表/示波器等功耗测量入口（当前未登记）
      do_not_touch:
        - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/USER/src/
        - CW32L010_StandardPeripheralLib_V1.0.5/Examples/sensor/gpio_input_output/USER/inc/
        - CH592EVT/EVT/EXAM/BLE/beiwov2/
        - dengbei_care/
