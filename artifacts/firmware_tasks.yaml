  - objective: >-
      完成完全遮光基准标定，使 readme 修改点 7 的“无光阈值取完全无光时的 1/3”真正生效。标定前必须保持现有未标定门禁：LIGHT_DARK_CALIBRATED=0 时 S 行 V=0、D=0，升温分支不触发，不得伪造或跳过。
      用当前交付构建（SENSOR_DEBUG_UART=1）先在有光环境记录 S 行 o/n/x/a；再用完全不透光遮蔽物完全包住 J4 光敏器件及其受光路径（不按压器件、不遮挡 SWD 排针），跨过下一次采样机会并至少再保持一个采样周期，记录各周期 o/n/x/a；
      取得至少 1 笔有效全暗样本即可作为候选 C_dark（均值或稳健中位；样本分散时记录 min/max 与取值理由），不新增固定样本数、额外仪器或额外遮光时长作为通过门槛。标定记录必须含板件 UID、VDD 供电、遮光方式与时间窗口、原始样本分布（min/max/mean）、实际取样次数、配置版本与构建摘要。
      移开遮蔽确认恢复到有光水平后，把 C_dark 回填唯一配置点 LIGHT_DARK_REF_CODE（1..4095）并置 LIGHT_DARK_CALIBRATED=1，重新构建。判据保持 dark = valid && (uint32)3*mean_adc_code >= C_dark（边界相等为暗、每笔独立、无滞回、无历史暗态），不得改用满量程、旧 350/250、有光读数或估算值。
      标定后复测三态：有光 V=1 D=0 且 mean < ceil(C_dark/3)；完全遮光 V=1 D=1 且 3*mean >= C_dark；移开恢复 D=0。若 ADC 全部超时仍须 valid=false、dark=false、不合成满量程；若有光均值与 ceil(C_dark/3) 分离不足，如实记录原始数值并按阈值/器件问题登记，不得修改判据或期望来凑通过。
