items:
  - "GXHT40 温湿度采集失败在真实目标上可诊断（不依赖逻辑分析仪的实板一手数据）：上电横幅之后、任何 I2C 事务之前，先读取 PA03(SCL)/PA04(SDA) 的空闲电平，再对 7bit 地址 0x08..0x77 逐地址做有界探测（START + 地址写字节 + ACK 判定 + STOP，只发地址、不写任何命令、不读数据、NACK 后必须释放总线），把空闲电平位掩码与收到 ACK 的地址集合（无则 none，最多列 8 个，超出以 + 结尾）打印为一条 BUS 诊断行；温湿度测量失败的周期在该周期 S 轨迹行之后追加一条 G 诊断行，给出本轮结果码（取驱动结果码：1=入参/2=无器件/3=读失败/4=CRC 错/5=量程无效）、0x44 与 0x45 各自本轮是否收到地址 ACK、最近一次读事务消耗的重读次数、本轮整帧重测次数、最近一次成功读回的 6 字节（未读成功则打印 12 个 -）；每条诊断行不超过 96 字节、只用整数与大写十六进制；成功且未上报周期的输出与既有 S 行逐字节相同，采样间期仍无任何字节；新增地址探测原语不得改变既有软 I2C 函数语义；诊断不得改变采样、判定、上报与冻结状态，SENSOR_DEBUG_UART=0 时全部为空实现。可观察：COM42@9600 复位后在横幅后可见一条 BUS 行（空闲电平与 ACK 地址集合），GXHT40 失败周期可见该周期 S 行（q=0）后紧跟一条 G 行，且 G 行的结果码、地址 ACK、重读/重测次数与原始字节与本周期实际失败原因自洽；正常周期仍只有一条 S 行。"

  - "GXHT40 温湿度采集在真实目标上恢复有效：依据上一增量在实板上取得的 BUS/G 原始数据定位失败环节（器件不应答或地址变体、读请求 NACK 未就绪、CRC 错、量程无效、总线被拉低卡死）并在驱动/总线层按证据修复；保留温度字与湿度字的双字 CRC-8 校验、整数 x10 换算与有效域、有界读重读与有界整帧重测，周期路径不得使用软复位 0x94 或加热命令，不得为通过而放宽或绕过 CRC、有效域与校验；任一失败周期仍不上报、不推进前一有效温度、不构造 0 值；任何失败（含缓存地址读失败）后下一周期必须重新探测 0x44/0x45 两个候选地址，并在重探前做有界总线恢复（例如 9 个 SCL 脉冲后发 STOP），不得因缓存地址失效让器件永久失联；等待与重试下限不低于器件手册的高重复率测量时间。可观察：真实目标每个 3 分钟采样周期的 S 行 q=1，t/h 落在有效域（温度 -40.0..125.0℃、湿度 0..100.0%RH）且与环境相符，连续多个周期稳定；满足上报条件时手机端显示的温湿度与该周期 S 行的 t/h 为同一笔读数；不得用宿主机 mock、桩或历史日志代替本轮实板观测。"

  - "光照完全无光基准在真实目标上标定并让 1/3 判据生效：在标定前保持未标定门禁（LIGHT_DARK_CALIBRATED=0 时 S 行 V=0、D=0，升温分支不触发），不得伪造或跳过；用当前交付构建在完全遮光（用不透光遮蔽物完全包住光敏器件及其受光路径，不按压器件、不遮挡调试排针）条件下取得 PB04/AIN11 原始样本（S 行的 o/n/x/a，供电、建立等待与取样次数与量产一致），并记录板件标识（BOOT 横幅 UID）、供电、遮光方式、原始样本分布（最小/最大/均值）、实际取样次数与配置版本；以实测全暗样本回填唯一配置点 LIGHT_DARK_REF_CODE 并置 LIGHT_DARK_CALIBRATED=1 后重新构建；判据保持 dark = valid 且 3*mean_adc_code >= C_dark（uint32 乘法、边界相等为暗、每笔独立、无滞回、无历史暗态），不支持满量程或亮态读数替代 C_dark；标定过程不得自行新增固定样本数量、额外仪器或额外遮光时长作为通过门槛。可观察：未标定构建在有光环境下 V=0、D=0 且 o=8；标定后构建在有光环境 V=1、D=0 且均值明显低于 ceil(C_dark/3)；完全遮光时同一或紧接的周期 V=1、D=1 且 3*mean_adc_code >= C_dark；移开遮蔽后恢复 V=1、D=0；若有光读数与 ceil(C_dark/3) 分离不足，如实记录原始数值并按阈值/器件问题登记，不得改判据或改期望。"

  - "条件上报判定按升温方向与严格边界：report = 温湿度均有效 且 ((存在前一有效温度 且 int32(本次温度 x10 - 前次温度 x10) > 9 且 光照有效 且 无光) 或 本次温度 x10 > 350)；方向为升温（本次比上次高），差值用 int32 防溢出；恰好 +0.9℃（差为 9）不触发；恰好 35.0℃（等于 350）不满足超温分支但若同时满足升温分支仍须触发，不得再对 350 做整体排除；无前一有效温度时仅超温分支可触发；光照无效或非无光时只关闭升温分支，超温分支独立生效；前一有效温度只在温湿度采样成功后推进，失败周期不推进、不构造 0 值；判定常量更名后在唯一配置点维护，接口契约 IC-002 的九组规范向量逐条一致。可观察：有光（D=0）或未标定时同样升温的周期 S 行 r=0 且无发送记录；遮光且本次比上次升温至少 1.0℃ 时 r=1 且该周期出现发送记录（s=1）；温度严格超过 35.0℃ 时即使有光或无前值也 r=1；恰好 35.0℃ 且无升温时不发送。"

  - "触发的待上报样本被冻结后再发送：置待上报时把当次温度与湿度冻结为快照，组帧只读该快照（明文 10 字节：sensor_id 4 字节 | 温度 x10 小端 2 字节 | 湿度 x10 小端 2 字节 | CRC16-CCITT-FALSE 小端 2 字节），沿用既有 Feistel 加密与 433 有界超时发送；重试期间（含跨 3 分钟周期）帧内容与快照逐字节一致，不随新采样、前一有效温度推进或最近有效湿度变化，且待上报未清除期间新的触发不得覆盖原有冻结样本；仅在发送成功时清除待上报，按上限重试用尽则放弃本轮且不伪造成功；帧布局、字节序、单位不变，不新增光照、原因、时间或序号字段；为可观测性增加一条 P 行（仅在本周期产生上报判定或发生过发送尝试时打印，紧跟 S 行，字段为本周期发送后的待上报标志、发送结果、重试计数与冻结快照的温度/湿度），P 行同样不超过 96 字节、不改变任何业务状态，SENSOR_DEBUG_UART=0 时为空实现。可观察：触发上报的周期 S 行 r=1、s=1 且 P 行显示组帧实际使用的冻结样本与当次触发样本一致；发送失败重试或跨周期重试时 P 行显示同一冻结温度/湿度，而 S 行的 t/h 随新采样变化；宿主机发送桩逐次核对重试期间帧字节不变、用尽后不放行假成功；真实目标上不得伪造发送失败或成功。"
