items:
  - "GXHT40 温湿度采集通路可用：每次采样触发后，驱动能探测 0x44/0x45 地址、发送 0xFD 高重复率测量命令、按 tMEAS 上限等待并读回 6 字节，温度字与湿度字分别通过 CRC-8（poly 0x31、init 0xFF）校验，输出带符号温度 x10（0.1℃，-400..1250）与湿度 x10（0.1%RH，截断 0..1000）；读请求 NACK、CRC 错或无器件时按上限有界重试，整次失败返回失败码且不修改传入的输出。"
  - "光照采集与无光判据可用：每次采样时 PB05 输出供电，经稳定等待后用 PB04/AIN11 多次转换取算术平均，按带滞回的阈值输出 DARK/LIT（无光=读数高），采样结束 PB05 回到低电平；ADC 轮询超时有界回退不挂死；阈值与滞回集中在唯一配置点，实板标定值未取得时配置显式标记为未标定（LIGHT_DARK_CALIBRATED=0），不得当作已验收。"
  - "3 分钟采样节拍与采样顺序：RTC 保持 1 分钟中断，累计 3 次才置一次采样请求；一个采样周期内只执行一次测量，且先采光照再测温湿度；温湿度整周期失败时不上报、不更新前一有效温度、不构造 0 值。"
  - "条件上报判定：仅当「本次有效温度比上次有效温度下降超过 0.9℃ 且无光」或「本次温度超过 35.0℃」时置待上报；恰好下降 0.9℃、恰好 35.0℃、无前一有效温度且未超温、有光且未超温时均不触发；无前一有效温度时仅超温分支可上报。"
  - "条件上报发送与空口兼容：仅有待上报样本时才组装 10 字节帧（sensor_id 4B | 温度 x10 小端 2B | 湿度 x10 小端 2B | CRC16-CCITT-FALSE 小端 2B）并沿用既有 Feistel 加密与 433 有界超时发送；编码字节序与加密前后布局保持不变、不新增光照字段；发送失败按上限有界重试，用尽则放弃本轮且不伪造成功；发送成功才清除待上报标志。"
  - "退役与新硬件冲突的旧通路：从固件工程与构建中移除 hall/OPTCFG/params/history 模块及其初始化、GPIOB 霍尔中断分支、LPTIM 中的 OPTCFG 分支与写 Flash 参数路径；PB04 仅作为 AIN11 模拟输入、PB05 仅作为光照供电输出、PB06 不再外驱动；上电后不存在可抢占这些引脚或改写参数的遗留通路。"
  - "网关与手机链路兼容核对：核对网关 CH592 固件按 temp=p[4..5]、hum=p[6..7] 取传感器帧字段，BLE 每设备 8 字节记录为 id|湿度大端|温度大端，并与 Android 的 u16be@4/s16be@6 解析一致；一致时明确记录「无需改动网关代码」的核对结论，不一致时按既有接口契约对齐帧布局与字节序。"
