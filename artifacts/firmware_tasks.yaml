    acceptance:
      - "未标定门禁：回填前构建在有光环境 S 行 V=0、D=0、o=8（或实际成功样本数）；升温分支不触发；不得出现伪造的 C_dark 或跳过门禁。"
      - "标定证据：完全遮光期间至少 1 笔有效全暗样本；记录 UID、VDD、遮光方式与时间、o/n/x/a 原始值、min/max/mean、取样次数、配置版本与构建摘要；若无有效样本（o=0）必须记录为标定未完成，不得用 0 或满量程代替。"
      - "配置正确：C_dark 为 1..4095 的实测值并回填唯一配置点，LIGHT_DARK_CALIBRATED=1；判据仍为 3*mean >= C_dark（uint32、边界相等为暗、无滞回），源码中不再保留旧 350/250 阈值。"
      - "三态复测：有光 V=1、D=0 且 mean < ceil(C_dark/3)；完全遮光 V=1、D=1 且 3*mean >= C_dark；移开遮蔽后的下一周期恢复 V=1、D=0。"
      - "异常路径：ADC 全部转换超时 → samples_ok=0、adc_ok=0、mean/min/max=0、valid=0、dark=0（不得合成暗态）；部分成功按实际成功样本均值并记录 o；光照无效只关闭升温分支，超温分支仍独立生效。"
      - "分离度：有光读数与 ceil(C_dark/3) 的间隔以原始数值报告；分离不足时登记为阈值/器件问题并保留判据不变，不得调低/调高阈值掩盖。"
      - "证据类别：当前构建的 COM43 原始串口字节（有光/遮光/恢复三态与未标定态）、标定记录、回填后的配置版本与构建/下载身份；不得用宿主 mock、历史日志或估算值替代实板标定。"
