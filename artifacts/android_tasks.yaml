items:
  - "新增纯逻辑模块 protocol/GatewayFrameCodec.kt 承载 BLE 聚合帧解码（16B 头块 = 网关ID 6B + devCount@6；每设备 16B 块取前 8B = sensor_id 4B 原字节顺序、humidity_x10 = u16be@4、temperature_x10 = s16be@6 有符号），并让 MqtttService 的解密后解析改为调用该模块；期望行为：解码结果与改动前的字节偏移、字节序、符号处理逐位一致，devCount 为 0 或帧长不足 expected = 16*(1+devCount) 时明确拒绝该帧且不产生读数、不落库、不上传。"
  - "移除 MqtttService 中无调用点且与接口契约冲突的小端解析入口 parseHexData（humidity|temperature 小端解释）；期望行为：工程内不再存在该小端解释入口与相关注释残留，且 BLE/MQTT 两条入口的解析均只经过 GatewayFrameCodec 的唯一实现。"
  - "新增纯逻辑模块 telemetry/ReadingAttribution.kt，把 MQTT 批量载荷 time:temp1,...:humi1,... 的归因从位置截断改为严格映射；期望行为：设备数、温度个数、湿度个数三者不一致或任一为空/含非法数值时拒绝整批（不落库、不上传、不报警），一致时按 MacIdBook 顺序得到 (devId, temperature, humidity) 列表，且 devId 随读数向下游传递而不再依赖下标。"
  - "新增 cloud/CloudConfig.kt 集中服务器常量，并把 MqtttService 的 MQTT broker 地址改为 ssl://8.140.23.253:8883、注册/上传 HTTP 基址改为 http://8.140.23.253:5000，同时在 res/xml/network_security_config.xml 追加放行 8.140.23.253 明文；期望行为：App 内不再出现 117.72.84.210，TLS 信任锚仍为 assets/jd-ca.crt、TLSv1.2、用户名=MAC、密码=MAC+&^!A:z? 全部保持原样，资源合并与构建通过。"
  - "新增纯逻辑模块 telemetry/AlarmEvaluator.kt，把温度湿度下降报警从「最近第 N 个样本」改为基于时间戳的时间窗判定（窗口 5/10/15 分钟，基准为不晚于 now-窗口 且不早于 now-窗口-回溯容差 的最新样本），阈值超限与紧急（>65.0℃）判定语义保持现状；期望行为：输入当前读数与候选历史样本即可得到 未设置报警/温度湿度下降报警/温湿度超限报警/无报警 与严重级别，基准样本缺失或无历史时下降分支不成立，恰好等于阈值不触发，且评估过程不写入任何伪造温度或湿度值。"
  - "扩展 TemperatureDatabaseHelper 到 DATABASE_VERSION = 3：新增 pending_uploads(dev_id, time, temperature, humidity, attempts, next_attempt_at, PRIMARY KEY(dev_id, time)) 表与其 next_attempt_at 索引，迁移对既有 temperature / alarm_events 结构与数据保持不动；期望行为：v2 数据库升级到 v3 后历史温湿度与报警记录仍可查，重复创建不报错，迁移异常时按既有回退策略处理且不崩溃。"
  - "修正本地入库时间戳：新增单条读数写入 API（devId、真实采样时间戳、温度、湿度、守护标志），BLE 路径使用接收时刻、MQTT 路径使用 payload 首段网关时间，并让现有调用点不再按 60 秒间隔回填历史时间戳；期望行为：写入行的 time 等于该读数的真实采样时间，同一 (dev_id, time) 重复写入不产生重复行，守护关闭（storeflag != 1）时不写入任何行。"
  - "在 ui/zhuce/ApiService.kt 新增 POST /upload_data 接口与对应请求体数据类（phone、mac、readings[{devId,time,temperature,humidity}]），并新增纯逻辑模块 cloud/UploadPayload.kt 构造该请求体；期望行为：字段名与服务器契约一致，temperature 为摄氏度、humidity 为百分比相对湿度、time 为 Unix 秒（由 0.1℃/0.1%RH 原始值除以 10 得到），readings 中的 devId 来自记录自身归因结果，既有 5 个端点签名与数据类字段不变。"
  - "新增 cloud/UploadOutbox.kt 与 cloud/CloudUploadRepository.kt 实现待发箱与上传编排：入队按 (dev_id, time) 幂等，成功（HTTP 成功）即删除，失败保留并按有界次数与退避重试（单批条数、退避上下限、最大尝试次数集中于一处常量），上传在独立作用域执行不阻塞 BLE 与 MQTT 主链路；期望行为：断网期间读数进入待发箱且不丢失，网络恢复后按 (dev_id, time) 不重复地补传，重复上传由服务端唯一键与本地待发箱双重去重，守护关闭或本机未注册手机号时不入队也不发起请求。"
  - "在 MqtttService 中完成编排接入：把设备读取周期常量与传感器 3 分钟采样节拍对齐（保留手动立即读取通道），processTemperatureHumidityData 改用 AlarmEvaluator 的判定结果、使用真实采样时间戳入库、并在入库成功后按待发箱与上传编排触发云上传，同时保留 900 秒报警去抖、>65℃ 每次通知、报警事件落库与既有报警文案字面值；期望行为：一次 BLE 或 MQTT 读数会依次完成归因、告警判定、去重落库与上传触发，任何一步失败都不影响其他步骤与后台循环，且上报失败不产生用户可见的阻塞或崩溃。"
  - "调整卡片状态展示：DeviceState 与 ui/home/DeviceCardAdapter.kt 不再以「30 分钟无数据」判定并显示离线，改为展示最近上报相对时间与按条件上报（可能长时间无上报）的提示，状态 chip 仍区分未收到/正常/警告/紧急；期望行为：长时间无新数据的设备不再显示为离线，未收到任何数据的设备仍显示为未收到且温度湿度为 --，报警级别配色语义不变。"
  - "调整设备详情与规则呈现：fragment_device_detail.xml 与 DeviceDetailFragment.kt 增加采样周期 3 分钟与条件上报规则（温度较上次下降超过 0.9℃且无光，或温度超过 35.0℃）的只读说明文字，图表可查询时间范围上限由 50 分钟放宽到 24 小时，并对超过 35.0℃ 的读数做高温样式强调（等于 35.0℃ 不强调）；期望行为：界面呈现的规则与 readme 一致，不显示任何光照、无光或 lux 信息，也不给出 App 推断出的上报原因结论。"
  - "调整早起报告文案与零样本表述：ReportGenerator 与 DailyReportWorker 在报告中说明数据为按条件上报、采样条数非等间隔，某设备当日无上报时显示为「昨日无上报」而非笼统「无数据」，日报的统计字段与报警次数结构保持现状；期望行为：报告对同一批数据给出的统计值与改动前一致，文案不暗示固定 3 分钟一条。"
  - "收尾：递增 app/build.gradle.kts 的 versionCode 与 versionName，更新 dengbei_care/readme.txt 变更记录与 dengbei_care/用户使用说明书.md 以说明 3 分钟采集与条件上报规则及云同步行为；期望行为：Gradle 构建与宿主机单元测试通过，文档描述与实现行为一致，且同步维护仓库根目录 file_manifest.txt 的新增与修改记录。"
