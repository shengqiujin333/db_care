items:
  - objective: >-
      修复“首次授予扫描权限后待执行扫描不自动开始、权限失败原因不精确”的实测行为（O-AA005-5 / O-AA005-1）：
      将扫描权限请求从 `NotificationsFragment` 经 `ActivityCompat.requestPermissions(requireActivity(), …)` 的 Activity 级路径，
      改为 fragment 自身 `registerForActivityResult(ActivityResultContracts.RequestMultiplePermissions())` 发起与消费；
      授权后重新用 `BlePermissionPolicy.evaluate(needScan=true)` 判定，`canScan=true` 时立即执行挂起的扫描动作，
      否则按 `reason/userMessage` 显示真实原因（蓝牙关闭/定位关闭/权限缺失），不得统一提示“未授予扫描权限”；
      拒绝/不再询问时清除挂起动作与提示具体缺失项，不自动重复请求；对话框/页面销毁时清除挂起与回调。
    input_refs:
      - artifacts/android_architecture.md
      - artifacts/android_implementation.md
      - evidence/android_check_20261111/SOFTWARE-TEST-ANDROID-RECHECK-001.md
      - evidence/software_test.md
      - dengbei_care/app/src/main/java/com/jinyuni/dengbei_care/ui/notifications/NotificationsFragment.kt
      - dengbei_care/app/src/main/java/com/jinyuni/dengbei_care/ui/gateway/GatewayBleSettingsDialog.kt
      - dengbei_care/app/src/main/java/com/jinyuni/dengbei_care/ble/BlePermissionPolicy.kt
    acceptance:
      - 扫描权限请求由 NotificationsFragment 的 registerForActivityResult(RequestMultiplePermissions) 发起并消费；对话框路径不再直接调用 ActivityCompat.requestPermissions(Activity)，结果不依赖 Activity 的 FragmentManager 分发。
      - API<31 真机首次点击「搜索附近网关」并授予定位后，无需再次点击即自动开始扫描（≤3 s 内出现 GatewayDiscovery scan started），10 s 内 stopScan；扫描停止后无新回调。
      - 授权后若蓝牙关闭，提示“蓝牙未开启（去开启）”，不启动扫描；定位总开关关闭提示“搜索网关需要开启定位（去开启定位）”；权限被拒绝提示具体缺失权限；不得统一显示“未授予扫描权限，无法搜索网关”。
      - 拒绝或“不再询问”后清除 pendingScan，不自动弹出第二次请求；用户再次点击才重新请求；对话框关闭/页面销毁后不迟发扫描、不调用已销毁视图。
      - 启动 App 与保存/清除网关均不请求定位权限；仅“搜索附近网关/扩大搜索”用户动作触发请求。
      - 新增宿主机静态核查（launcher 存在、对话框无 Activity 级 requestPermissions、销毁清理）并通过；现有 261 项宿主机用例全通过、assembleDebug 成功且无新增编译告警。
      - 首次授权自动开始扫描、拒绝/蓝牙关闭/定位关闭文案与无重复请求由软件测试在真机独立验收；本项不以宿主机断言代替。
    metadata:
      scope: android_implementation
      relates_to: AA-006 N-1 / D-35 / D-36；O-AA005-5、O-AA005-1
      upstream_acceptance: ST-AA005-R2 §5 O-AA005-5；software_triage_20261111 §5 O-AA005-1；TD-SW-004 T-SW-L2-40/42
      device_dependency: Redmi 8A / Android 10 / API 29（12f046690506）；首次定位授权、拒绝、不再询问、蓝牙关闭、定位关闭；由测试能力执行
      normal_targets: 授权后自动开始且有界停止；扫描候选正常呈现；重复点击不并行扫描
      abnormal_targets: 拒绝/不再询问无扫描且提示具体权限；蓝牙关闭/定位关闭提示真实原因；页面销毁/对话框关闭无迟发回调；不崩溃
      compatibility_hold: 不改 BLE 协议/扫描过滤/10 s 上限/stopScan 全路径；不改 gateway_ble_addr/mac_addr 语义；不新增权限声明

  - objective: >-
      修复 BLE 读取尝试结束后链路状态无终态的问题（O-AA005-6）：新增纯逻辑读取状态映射（RejectionReason/LengthVerdict/
      Success → DATA_OK / GATEWAY_NO_DATA / GATEWAY_NO_DEVICE / READ_INCOMPLETE / READ_INVALID），并在 MqtttService 的
      onCharacteristicRead 所有分支统一设置终态；`devCount=0` 的 NO_DEVICE 不再停留在“正在连接网关…”，
      长度不足/非 16 对齐保持 READ_INCOMPLETE，解密失败/帧头不足为 READ_INVALID（带原因）；
      有效批次/全占位分别保持 DATA_OK / GATEWAY_NO_DATA；状态码稳定可被测试与日志断言。
    input_refs:
      - artifacts/android_architecture.md
      - artifacts/android_implementation.md
      - evidence/android_check_20261111/SOFTWARE-TEST-ANDROID-RECHECK-001.md
      - evidence/software_test.md
      - dengbei_care/app/src/main/java/com/jinyuni/dengbei_care/MqtttService.kt
      - dengbei_care/app/src/main/java/com/jinyuni/dengbei_care/protocol/GatewayFrameCodec.kt
      - dengbei_care/app/src/main/java/com/jinyuni/dengbei_care/protocol/GatewayReadGuard.kt
    acceptance:
      - 新增纯逻辑 GatewayReadState（无 Android 依赖），覆盖：Success+至少一条有效读数→DATA_OK；全占位→GATEWAY_NO_DATA；NO_DEVICE→GATEWAY_NO_DEVICE；FRAME_TOO_SHORT→READ_INVALID；LENGTH_MISMATCH/LENGTH_NOT_ALIGNED→READ_INCOMPLETE；DECRYPT_FAILED/CIPHERTEXT_NOT_ALIGNED→READ_INVALID；未知→READ_INVALID；映射带稳定状态码与文案类别。
      - MqtttService 在每次 onCharacteristicRead 的 Success/Rejected/长度拒绝分支都调用同一映射并写首页链路状态；读取结束后不存在仍停留在 CONNECTING 的路径。
      - 真实网关 devCount=0 读取（MTU 240、FFE2 160 B）后首页显示“网关已连接，暂无设备（N=0）”，下一个 180 s 周期仍可正常读取；不再出现长时间“正在连接网关…”。
      - 有效批次仍显示 DATA_OK；全占位显示 GATEWAY_NO_DATA；READ_INCOMPLETE/READ_INVALID 文案与原因可区分；状态更新不改变本地入库/上传/告警。
      - 新增宿主机映射矩阵测试并全通过；现有 261 项宿主机用例全通过、assembleDebug 成功且无新增编译告警。
      - 真实 devCount=0、占位与完整批次的状态显示由软件测试在真机独立验收；本项不宣称真实多设备/9 台已通过。
    metadata:
      scope: android_implementation
      relates_to: AA-006 N-2 / D-37；O-AA005-6
      upstream_acceptance: ST-AA005-R2 §5 O-AA005-6；TD-SW-004 T-SW-L2-45/53/54
      device_dependency: 真实网关（当前 devCount=0）与 Redmi 8A/API29；多设备/占位由测试能力在可得条件下验收
      normal_targets: 有效批次 DATA_OK；全占位 GATEWAY_NO_DATA；devCount=0 GATEWAY_NO_DEVICE；终态在首页可见
      abnormal_targets: 长度不足/非对齐 READ_INCOMPLETE；解密/帧头失败 READ_INVALID；不再残留 CONNECTING；不产生读数或错误入库
      compatibility_hold: 不改帧解码/长度判定/容量守卫/入库/上传/告警；不新增线上字段

  - objective: >-
      修复报告页“重新生成”在零设备/无数据时无可感知反馈的问题（RECHECK-002 O-2）：新增纯逻辑
      ReportRegenerateFeedback 判定（succeeded / hasContent / deviceCount / sampleCount → 消息类别与是否恢复按钮），
      ReportActivity 点击后显示进度并禁用按钮；Worker 成功但无数据时提示“暂无可生成的数据（尚无设备读数）”，
      失败提示“报告生成失败，请稍后重试”，有数据成功则刷新文本与生成时间并恢复按钮；
      连续点击不产生并行任务；不改变报告内容/统计规则与 KEY_REPORT_TEXT/KEY_REPORT_TIME 契约。
    input_refs:
      - artifacts/android_architecture.md
      - artifacts/android_implementation.md
      - evidence/product_acceptance_20261112_scope_recheck/PRODUCT-ACCEPTANCE-RECHECK-002.md
      - dengbei_care/app/src/main/java/com/jinyuni/dengbei_care/report/ReportActivity.kt
      - dengbei_care/app/src/main/java/com/jinyuni/dengbei_care/report/DailyReportWorker.kt
      - dengbei_care/app/src/main/java/com/jinyuni/dengbei_care/report/ReportGenerator.kt
      - dengbei_care/app/src/main/res/layout/activity_report.xml
    acceptance:
      - 新增纯逻辑 ReportRegenerateFeedback（无 Android 依赖）：零设备、无当日读数、生成内容为空、成功、失败、重复点击等输入均返回确定的消息类别/按钮状态；无数据不算错误但必须提示。
      - 点击「重新生成」立即显示进度并禁用按钮；结束（成功/失败/无数据）后按钮恢复，不出现无反馈的静默完成。
      - Worker 成功但无可生成数据（无设备或无当日样本或文本为空/与上次相同）→ Toast/Snackbar“暂无可生成的数据（尚无设备读数）”；Worker 失败 → “报告生成失败，请稍后重试”；有数据成功 → 刷新报告文本与生成时间。
      - 连续点击不并行触发多次生成；页面销毁后回调不操作已销毁视图、不崩溃。
      - 报告内容/统计规则、KEY_REPORT_TEXT/KEY_REPORT_TIME、ReportGenerator 输出与通知行为不变；不新增线上字段。
      - 新增宿主机纯逻辑测试并全通过；现有 261 项宿主机用例全通过、assembleDebug 成功且无新增编译告警。
      - 零设备/无数据提示与按钮恢复由软件测试在真机独立验收；有数据时刷新沿用既有行为与证据。
    metadata:
      scope: android_implementation
      relates_to: AA-006 N-3 / D-38；RECHECK-002 O-2
      upstream_acceptance: PRODUCT-ACCEPTANCE-RECHECK-002 §3.1 O-2；既有报告页回归 ST-013
      device_dependency: Redmi 8A/API29；当前零设备即可验证无数据提示；有数据刷新由测试能力按可得数据验收
      normal_targets: 点击有进度、结束有结果提示；有数据成功刷新文本/时间；按钮恢复
      abnormal_targets: 零设备/无数据有明确提示；失败提示；连续点击不并行；销毁后无崩溃
      compatibility_hold: 不改报告内容/统计/存储键/通知调度；不改 WorkManager 唯一工作名之外的契约
