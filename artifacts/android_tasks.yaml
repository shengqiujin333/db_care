items:
  - objective: >-
      修正 BLE 运行时权限模型与请求流程：新增纯逻辑 ble/BlePermissionPolicy.kt，按 API 级别与连接方式判定所需权限
      （API 26–30 直连 GATT 不再要求 ACCESS_FINE_LOCATION；API 31+ 直连需 BLUETOOTH_CONNECT；仅实际使用 BLE 扫描时
      API<31 才要求 ACCESS_FINE_LOCATION 且定位总开关开启、API 31+ 才要求 BLUETOOTH_SCAN），并让
      MqtttService.checkBluetoothPermission/isBluetoothBusy/connectToBluetoothDevice 共用该策略；同时改造
      MainActivity 的权限请求流程（按 API 请求已声明权限、处理拒绝与“不再询问”）与首页链路状态展示，
      使权限缺失/蓝牙关闭不再表现为每 180 s 静默返回。
    input_refs:
      - artifacts/android_architecture.md
      - artifacts/android_feasibility.md
      - artifacts/interface_contract.md
      - dengbei_care/app/src/main/java/com/jinyuni/dengbei_care/MqtttService.kt
      - dengbei_care/app/src/main/java/com/jinyuni/dengbei_care/MainActivity.kt
      - dengbei_care/app/src/main/AndroidManifest.xml
      - dengbei_care/app/src/main/java/com/jinyuni/dengbei_care/ui/home/HomeFragment.kt
    acceptance:
      - 新增 ble/BlePermissionPolicy.kt 为无 Android 依赖的纯逻辑，宿主机用例覆盖 SDK 26/29/30/31/33 × 直连/扫描 × 授予/拒绝矩阵；API<31 直连恒 canConnect=true 且缺失项不含 ACCESS_FINE_LOCATION。
      - MqtttService 的直连前置不再检查 ACCESS_FINE_LOCATION；API 31+ 缺 BLUETOOTH_CONNECT 时与策略结果一致地拒绝连接。
      - MainActivity 启动/开启守护时按 API 请求权限：仅 API>=31 请求 BLUETOOTH_CONNECT 与 BLUETOOTH_SCAN（扫描场景），仅 API>=33 请求 POST_NOTIFICATIONS；请求集合与 AndroidManifest 声明一致，不再出现不可达的请求分支。
      - 权限被拒绝或“不再询问”时，首页链路状态区显示具体缺失项与可执行动作（去授权/打开系统设置），且 MqtttService 日志包含 sdkInt、缺失权限与 needScan；不存在仅一行日志后静默返回的路径。
      - 权限恢复后无需重启进程即可继续下一轮连接，既有本地库与待上传队列不被清空。
      - 现有宿主机单元测试全部通过、assembleDebug 成功且无新增编译告警。
      - 真机权限弹窗、拒绝后行为与真实 GATT 连接由软件测试独立验收，不在本项宣称通过。
    metadata:
      scope: android_implementation
      relates_to: AA-003 G-1 / D-16 / D-19
      device_dependency: 真实 BLE 弹窗与 GATT 行为需真机，由测试能力验收
      compatibility_hold: 不改 AES/证书/UUID/topic/上传契约

  - objective: >-
      用正常发现/绑定流程确认网关身份并替换硬编码 BLE 地址：新增 protocol/GatewayIdentity.kt（MAC 规范化与校验、
      扫描候选去重排序、绑定状态）与 ble/GatewayDiscovery.kt（有界 10 s 扫描，优先按服务 UUID FFE0 过滤，
      用户显式操作时可退化为无过滤扫描，所有结束路径必须 stopScan），新增 MyPrefs gateway_ble_addr 作为唯一
      GATT 连接身份；网关选择 UI 呈现候选名称/MAC/RSSI 并允许手动输入，保存后持久化；mac_addr（topic 与
      /upload_data.mac）语义保持不变，两者分别展示、不互相推导。
    input_refs:
      - artifacts/android_architecture.md
      - artifacts/android_feasibility.md
      - artifacts/interface_contract.md
      - dengbei_care/app/src/main/java/com/jinyuni/dengbei_care/MqtttService.kt
      - dengbei_care/app/src/main/java/com/jinyuni/dengbei_care/ui/gateway/GatewayFragment.kt
      - dengbei_care/app/src/main/java/com/jinyuni/dengbei_care/ui/notifications/NotificationsFragment.kt
    acceptance:
      - 工程内除迁移默认常量一处外不再出现硬编码 84:C2:E4:03:02:02；连接目标只来自 MyPrefs.gateway_ble_addr（缺失时使用迁移默认值并在界面标注“未确认”）。
      - GatewayIdentity 宿主机用例覆盖：大小写/单双位段/分隔符规范化、非法长度与字符拒绝、空值、候选按 FFE0 优先与 RSSI 排序且 MAC 去重、绑定状态判定。
      - 扫描为有界操作（上限 10 s），超时、取消、页面销毁、蓝牙关闭、权限撤销均执行 stopScan 并释放回调；不存在持续扫描或泄漏。
      - 扫描无结果时显示“未找到网关”并保留手动输入；不自动连接任何未确认地址；多候选由用户显式选择。
      - 保存后下一轮读取使用该地址，连接日志同条记录 gateway_ble_addr 与 mac_addr 并分别标注用途；两者在任何代码路径都不互相推导或覆盖。
      - API<31 仅在扫描流程请求 ACCESS_FINE_LOCATION 并提示开启定位总开关；API 31+ 扫描仅请求 BLUETOOTH_SCAN。
      - 现有宿主机单元测试全部通过、assembleDebug 成功且无新增编译告警。
      - 真实网关广播内容、候选列表、保存后重连与配对行为由软件测试在真机独立验收。
    metadata:
      scope: android_implementation
      relates_to: AA-003 G-2 / D-17 / D-18
      unknown: 网关是否广播 FFE0 服务与设备名未证实，设计以过滤 + 无过滤回退兼容
      device_dependency: 真实 BLE 扫描与网关身份需真机与网关上电，由测试能力验收
      compatibility_hold: mac_addr/topic/上传契约不变

  - objective: >-
      修正 BLE 读取批次向 MQTT 的转发与零值哨兵：新增纯逻辑 telemetry/BleBatchForwarding.kt，把一次读取的
      全部读数与当前绑定顺序比对，数量/ID/顺序一致时按绑定顺序构造完整批量载荷并发布，否则拒绝转发并记录原因；
      MqtttService 删除“只保留最后一笔”的 bletime/bleTempData/bleHumiData 覆盖写法与 isZeroValue 连续 3 次门槛，
      使 0.0℃/0.0%RH 作为合法读数正常判定、入库与上传；本地按 ID 逐条处理与上传不受转发拒绝影响。
    input_refs:
      - artifacts/android_architecture.md
      - artifacts/interface_contract.md
      - dengbei_care/app/src/main/java/com/jinyuni/dengbei_care/MqtttService.kt
      - dengbei_care/app/src/main/java/com/jinyuni/dengbei_care/protocol/GatewayFrameCodec.kt
      - dengbei_care/app/src/main/java/com/jinyuni/dengbei_care/telemetry/ReadingAttribution.kt
    acceptance:
      - 单设备且 ID 匹配时生成的 MQTT 载荷与既有格式逐字一致（<epoch_seconds>:<temp>:<humi>，单位 ℃/%RH）。
      - 多设备时载荷按当前绑定顺序包含本次全部读数；数量不符、未知 ID、重复 ID、顺序不符时拒绝转发，且不产出任何部分载荷。
      - 空批次/devCount=0/帧被拒绝时不发布、不入库、不上传。
      - 转发拒绝只影响发布：本次读数仍按各自 devId 完成告警判定、入库（真实接收时刻）与上传入队。
      - 工程内不存在“只保留最后一笔”的转发状态变量与 isZeroValue 哨兵分支；0.0/0.0 读数进入正常处理路径。
      - 新增宿主机用例覆盖 Forward/Refuse 全部分支与绑定顺序；现有宿主机单元测试全部通过、assembleDebug 成功且无新增编译告警。
      - 真实网关多设备批次与 MQTT 实际发布由软件测试在真机联调验收。
    metadata:
      scope: android_implementation
      relates_to: AA-003 G-3 / D-20 / D-21 / IC-002 D-03
      device_dependency: 真实多设备帧与 broker 侧收包需真机与网关，由测试能力验收
      compatibility_hold: MQTT topic 与载荷格式不变

  - objective: >-
      更正用户可见的上报规则文案为升温方向并冻结严格边界表述：DetailPresentation.REPORT_RULE_TEXT 改为
      “采样周期 3 分钟。仅当温度较上次升高超过 0.9℃且无光，或温度超过 35.0℃ 时才上报；未满足条件时不会上报，
      因此可能长时间没有新数据。”；同步 dengbei_care/用户使用说明书.md 与 dengbei_care/readme.txt 变更记录中的
      对应句子，并递增版本号；保留 App 自身“温度湿度下降报警”功能与措辞不变，不新增 App 侧门控或光照推断。
    input_refs:
      - artifacts/android_architecture.md
      - artifacts/interface_contract.md
      - readme.txt
      - dengbei_care/app/src/main/java/com/jinyuni/dengbei_care/ui/detail/DetailPresentation.kt
      - dengbei_care/用户使用说明书.md
      - dengbei_care/readme.txt
    acceptance:
      - 详情页规则文案逐字为“仅当温度较上次升高超过 0.9℃且无光，或温度超过 35.0℃ 时才上报”，表达严格边界（0.9℃ 需超过、35.0℃ 需超过、等于不触发）。
      - 工程内不存在“较上次下降超过 0.9”表述；用户说明书与变更记录同步为升高方向；App 自身“温度湿度下降报警”面板与文案保持不变。
      - 文案不显示光照状态、照度或 lux，也不给出 App 推断的上报原因；不新增任何 0.9℃/35℃ 门控计算。
      - 新增或更新的宿主机用例断言方向、严格边界、禁词与“无推断原因”；现有全部宿主机用例通过、assembleDebug 成功。
      - app/build.gradle.kts 的 versionCode/versionName 递增，且构建产物中版本一致；file_manifest.txt 同步本次新增与修改文件。
      - 真机界面呈现由软件测试截图验收，本项不以宿主机断言代替界面结论。
    metadata:
      scope: android_implementation
      relates_to: AA-003 G-4 / D-22 / IC-002 §7 Android 同步
      device_dependency: 界面呈现需真机截图，由测试能力验收
      compatibility_hold: 不改 App 报警功能、阈值、去抖与报警文案
