items:
  - objective: >-
      修正 BLE 运行时权限模型与请求流程：新增纯逻辑 ble/BlePermissionPolicy.kt，按 API 级别与连接方式判定所需权限
      （API 26–30 直连 GATT 不再要求 ACCESS_FINE_LOCATION；API 31+ 直连需 BLUETOOTH_CONNECT；仅实际使用 BLE 扫描时
      API<31 才要求 ACCESS_FINE_LOCATION 且定位总开关开启、API 31+ 才要求 BLUETOOTH_SCAN），并让
      MqtttService.checkBluetoothPermission/isBluetoothBusy/connectToBluetoothDevice 共用该策略；同时改造
      MainActivity 的权限请求流程（按 API 请求已声明权限、处理拒绝与“不再询问”、去掉不可达/重复请求分支）与首页链路状态展示，
      使权限缺失/蓝牙关闭/定位关闭不再表现为每 180 s 静默返回。保留 Manifest 中的 ACCESS_FINE_LOCATION 声明
      （既有 Wi-Fi 配网页 GatewayFragment 仍需要），仅移除其作为 BLE 直连前置的用法。
    input_refs:
      - artifacts/android_architecture.md
      - artifacts/android_feasibility.md
      - artifacts/system_analysis_current.md
      - artifacts/software_test_design.md
      - dengbei_care/app/src/main/java/com/jinyuni/dengbei_care/MqtttService.kt
      - dengbei_care/app/src/main/java/com/jinyuni/dengbei_care/MainActivity.kt
      - dengbei_care/app/src/main/java/com/jinyuni/dengbei_care/ui/gateway/GatewayFragment.kt
      - dengbei_care/app/src/main/AndroidManifest.xml
      - dengbei_care/app/src/main/java/com/jinyuni/dengbei_care/ui/home/HomeFragment.kt
      - dengbei_care/app/src/main/java/com/jinyuni/dengbei_care/ui/home/HomeViewModel.kt
    acceptance:
      - 新增 ble/BlePermissionPolicy.kt 为无 Android 依赖的纯逻辑；宿主机用例覆盖 SDK 26/29/30/31/33 × 直连/扫描 × 授予/拒绝 × 适配器开关/定位开关矩阵，输出 canConnect/canScan/missing/reason/userMessage。
      - API<31 直连恒 canConnect=true 且 missing 不含 ACCESS_FINE_LOCATION；适配器关闭时 canConnect=false 且 reason=BLUETOOTH_OFF；API 31+ 缺 BLUETOOTH_CONNECT 时拒绝连接。
      - needScan 时 API<31 要求 FINE_LOCATION 且 locationEnabled=true（否则 reason=LOCATION_OFF），API 31+ 要求 BLUETOOTH_SCAN；直连路径不受定位总开关影响。
      - MqtttService 的直连前置不再检查 ACCESS_FINE_LOCATION；权限门失败写入一次可读链路状态（含原因与动作），日志包含 sdkInt、缺失权限、needScan、adapterEnabled；不存在仅一行 “Bluetooth permission not granted” 后返回的路径。
      - MainActivity 启动/开启守护时按 API 请求权限：仅 API>=31 请求 BLUETOOTH_CONNECT 与（扫描场景）BLUETOOTH_SCAN，仅 API>=33 请求 POST_NOTIFICATIONS，仅 API<31 的扫描流程请求定位；请求集合与 AndroidManifest 声明一致，不出现不可达或拒绝后无限重复请求的分支。
      - 权限被拒绝或“不再询问”时，首页状态区显示具体缺失项与可执行动作（去授权/打开系统设置/去开启定位），MqtttService 日志同条包含原因；权限恢复后无需重启进程即可继续下一轮连接，既有本地库与待上传队列不被清空。
      - 既有 Wi-Fi 配网页（GatewayFragment）保持可用：不因本项移除其 API<33 的定位权限请求路径。
      - 现有宿主机单元测试全部通过、assembleDebug 成功且无新增编译告警。
      - 真机权限弹窗、拒绝后行为与真实 GATT 连接由软件测试独立验收，不在本项宣称通过。
    metadata:
      scope: android_implementation
      relates_to: AA-005 G-1 / D-16 / D-19
      upstream_acceptance: TD-SW-004 T-SW-L1-25/32、T-SW-L2-35/36/37/38/39、T-SW-L0d-12
      device_dependency: 真实 BLE 弹窗与 GATT 行为需真机（Redmi 8A/API 29）；API 31+ 分支需另一台设备或 AVD，由测试能力验收
      normal_targets: 未授予定位仍发起 GATT 尝试；授权后下一轮恢复；API31+ 授予 CONNECT 后可连接；Wi-Fi 配网扫描不受影响
      abnormal_targets: 拒绝/不再询问显示具体原因与动作；蓝牙关闭、定位关闭、权限运行中撤销均停止并有状态；不崩溃、不清数据、不重复弹窗
      compatibility_hold: 不改 AES/证书/UUID/topic/上传契约/SQLite 表结构；不删除 Manifest 既有权限声明

  - objective: >-
      用正常发现/绑定流程确认网关身份并替换硬编码 BLE 地址：新增 protocol/GatewayIdentity.kt（MAC 规范化与校验、
      扫描候选去重排序、迁移默认与已清除判定）与 ble/GatewayDiscovery.kt（有界 10 s 扫描，优先按服务 UUID FFE0 过滤，
      用户显式操作时可退化为无过滤扫描，所有结束路径必须 stopScan），新增 MyPrefs gateway_ble_addr 作为唯一 GATT
      连接身份；在网关设置区呈现候选名称/MAC/RSSI 并允许手动输入/清除，保存后持久化；mac_addr（topic 与
      /upload_data.mac）语义保持不变，两者分别展示、不互相推导。既有 ui/gateway/GatewayFragment 是 Wi-Fi 配网页，
      不得复用作 BLE 发现入口。
    input_refs:
      - artifacts/android_architecture.md
      - artifacts/android_feasibility.md
      - artifacts/interface_contract.md
      - CH592EVT/EVT/EXAM/BLE/beiwov2/APP/peripheral.c
      - CH592EVT/EVT/EXAM/BLE/beiwov2/Profile/include/gattprofile.h
      - dengbei_care/app/src/main/java/com/jinyuni/dengbei_care/MqtttService.kt
      - dengbei_care/app/src/main/java/com/jinyuni/dengbei_care/ui/notifications/NotificationsFragment.kt
    acceptance:
      - Android 应用源码（dengbei_care/app/src/main）内，除迁移默认常量一处外不再出现硬编码 84:C2:E4:03:02:02；连接目标只来自 MyPrefs.gateway_ble_addr（缺失且未被清除时使用迁移默认值并在界面标注“未确认”）。
      - 用户显式清除后写“已清除”标记，后续读取不得静默回退到迁移默认值；清除状态与“未配置”在界面可区分。
      - GatewayIdentity 宿主机用例覆盖：大小写/单双位段/分隔符规范化、非法长度与字符拒绝、空值、候选按 FFE0 优先与 RSSI 降序排序且 MAC 去重、绑定状态判定、迁移默认判定。
      - 扫描为有界操作（上限 10 s），超时、取消、页面销毁、蓝牙关闭、权限撤销均执行 stopScan 并释放回调；停止后 ≥15 s 无新回调；不存在持续扫描或泄漏。
      - 扫描无结果时显示“未找到网关”并保留手动输入与“扩大搜索（不过滤）”；不自动连接任何未确认地址；多候选由用户显式选择。
      - 保存后下一轮读取使用该地址；连接日志同条记录 gateway_ble_addr 与 mac_addr 并分别标注用途；两者在任何代码路径都不互相推导或覆盖。
      - API<31 仅在扫描流程请求 ACCESS_FINE_LOCATION 并提示开启定位总开关；API 31+ 扫描仅请求 BLUETOOTH_SCAN。
      - 现有宿主机单元测试全部通过、assembleDebug 成功且无新增编译告警。
      - 真实网关广播内容、候选列表、保存后重连与配对行为由软件测试在真机独立验收；本项不宣称网关已可被发现或连接。
    metadata:
      scope: android_implementation
      relates_to: AA-005 G-2 / D-17 / D-18 / D-29
      upstream_acceptance: TD-SW-004 T-SW-L1-26/27/32、T-SW-L0d-11、T-SW-L2-40/41/42
      unknown: 网关是否在真实空中广播 FFE0 与名称未验证（源码显示 advertData 含 0xFFE0、扫描响应名 "xxx"）；设计以过滤 + 无过滤回退兼容
      device_dependency: 真实 BLE 扫描与网关身份需真机与网关上电，由测试能力验收
      normal_targets: 扫描得到候选并由用户保存；重启后仍使用已保存地址；连接日志两身份分列
      abnormal_targets: 无候选/超时/取消/页面销毁/蓝牙关闭/权限撤销均停止扫描并提示；非法/无法解析地址回到未配置；不自动连接他人网关
      compatibility_hold: mac_addr/topic/上传契约不变；不新增 BLE 服务或控制命令；不改既有 Wi-Fi 配网页

  - objective: >-
      修正 BLE 读取批次向 MQTT 的转发：新增纯逻辑 telemetry/BleBatchForwarding.kt，把一次读取的全部读数与当前绑定顺序
      比对，数量/ID/顺序一致时按契约构造 `<epoch_seconds>:<temps csv>:<humis csv>`（冒号三段、温度在前、逗号分隔、无空格、
      Locale.US）并发布，否则拒绝转发并记录原因；MqtttService 删除“只保留最后一笔”的 bletime/bleTempData/bleHumiData
      覆盖写法，改为每次成功读取后在 MQTT 已连接时立即发布，未连接时只保留最近一批并在连接成功后发布一次；本地按 ID
      逐条处理与上传不受转发拒绝影响；保留既有 topic 选择分支。
    input_refs:
      - artifacts/android_architecture.md
      - artifacts/interface_contract.md
      - artifacts/system_analysis_current.md
      - artifacts/software_test_design.md
      - dengbei_care/app/src/main/java/com/jinyuni/dengbei_care/MqtttService.kt
      - dengbei_care/app/src/main/java/com/jinyuni/dengbei_care/protocol/GatewayFrameCodec.kt
      - dengbei_care/app/src/main/java/com/jinyuni/dengbei_care/telemetry/ReadingAttribution.kt
    acceptance:
      - 单设备且 ID 匹配时生成的载荷逐字为 `<epoch_seconds>:<temp>:<humi>`（例如 `1700000000:25.5:60.0`），可被 ReadingAttribution 正常解析；格式化固定 Locale.US，小数点必为 `.`。
      - 多设备时载荷按当前绑定顺序包含本次全部读数，温度为前段、湿度为后段；数量不符、未知 ID、重复 ID、顺序不符、全占位时拒绝转发，且不产出任何部分载荷。
      - 空批次/devCount=0/帧被拒绝时不发布、不入库、不上传。
      - 转发拒绝只影响发布：本次读数仍按各自 devId 完成告警判定、入库（接收时刻）与上传入队。
      - 工程内不存在“只保留最后一笔”的转发状态变量；不存在 `bletime + ',' + ...` 形式或 `humi...,temp...` 顺序的载荷拼接；载荷构造只有一处。
      - MQTT 未连接时的成功读取只保留最近一批待转发（有界为 1），连接成功后发布一次；发布失败不阻塞本地处理，下一批覆盖。
      - 新增宿主机用例覆盖 Forward/Refuse 全部分支、绑定顺序、单/多设备载荷逐字断言；现有宿主机单元测试全部通过、assembleDebug 成功且无新增编译告警。
      - 真实网关多设备批次与 MQTT 实际发布由软件测试在真机联调验收。
    metadata:
      scope: android_implementation
      relates_to: AA-005 G-3 / D-20 / D-26 / IC-002 §7
      upstream_acceptance: TD-SW-004 T-SW-L1-28、T-SW-L2-43/44/49
      device_dependency: 真实多设备帧与 broker 侧收包需真机与网关，由测试能力验收
      normal_targets: 单设备载荷与既有格式一致；多设备按绑定顺序完整发布；未连接时连接后补发最近一批
      abnormal_targets: 数量/ID/顺序不符或全占位拒绝发布并记录原因；本地处理不中断；不发布部分批次
      compatibility_hold: MQTT topic、AES、BLE 布局不变；不改网关固件

  - objective: >-
      修正 BLE 观测有效性：新增纯逻辑 telemetry/BleObservation.kt 判定网关“无数据占位”（设备块 8 B 全零：ID 00000000
      且 temperature_x10=0 且 humidity_x10=0），占位不产生读数、不入库、不入待发箱、不生成/更新设备卡片、不触发报警，
      链路状态显示“网关暂无传感器数据”；删除 MqtttService 的 isZeroValue/bleZeroCount 连续 3 次门槛，使带有效绑定 ID 的
      0.0℃/0.0%RH 首次即按合法读数处理；同步观测语义与界面措辞（接收时间≠传感器采样时刻，卡片相对时间标注“最近读取/更新”），
      并保持“每次成功读取按接收时间入库/上传”的观测语义（不引入按值去重）。
    input_refs:
      - artifacts/android_architecture.md
      - artifacts/interface_contract.md
      - CH592EVT/EVT/EXAM/BLE/beiwov2/APP/app_um2006A.c
      - dengbei_care/app/src/main/java/com/jinyuni/dengbei_care/MqtttService.kt
      - dengbei_care/app/src/main/java/com/jinyuni/dengbei_care/protocol/GatewayFrameCodec.kt
      - dengbei_care/app/src/main/java/com/jinyuni/dengbei_care/DeviceState.kt
      - dengbei_care/app/src/main/java/com/jinyuni/dengbei_care/ui/detail/DetailPresentation.kt
    acceptance:
      - 8 B 全零设备块（ID 00000000、T_x10=0、H_x10=0）被判为 Placeholder：不写入 temperature/alarm_events/pending_uploads，不生成 00000000 设备卡片，不触发通知，日志/链路状态记录“网关暂无传感器数据”。
      - 整批均为占位时不发布 MQTT、不处理任何设备；混合批次中占位块被跳过，其余有效 ID 读数照常处理。
      - 带有效绑定 ID 的 0.0℃/0.0%RH 首次读取即进入正常处理路径（告警/入库/入队/卡片），工程内不存在 isZeroValue 或“连续 3 次”门槛。
      - 每次成功读取（非占位）仍按接收 Unix 秒入库并进入上传编排；不新增按值去重分支，不改 (dev_id,time) 幂等键与既有表结构。
      - GatewayFrameCodec.SensorSample 增加 temperatureX10/humidityX10（additive），不改变现有字段、偏移、字节序与符号；占位判定以原始 x10 整数为准，不用浮点比较。
      - 卡片/详情的相对时间基于最近一次成功读取并标注“最近读取/更新”；详情说明“接收时间为手机读取网关缓存的时刻，不是传感器采样时刻”；不出现“离线”推断。
      - 新增宿主机用例覆盖 Placeholder/Reading 分类、0.0/0.0 合法路径、占位不落库不发布；现有宿主机单元测试全部通过、assembleDebug 成功且无新增编译告警。
      - 真实 BLE 占位帧与真实 0.0/0.0 源由软件测试在真机验收；无可控源时记 NOT EXECUTED，不以 MQTT 注入替代 BLE 结论。
    metadata:
      scope: android_implementation
      relates_to: AA-005 G-5 / D-21 / D-24 / D-25 / D-30
      upstream_acceptance: TD-SW-004 T-SW-L1-29、T-SW-L0d-13、T-SW-L2-45/46
      device_dependency: 真实网关无数据占位帧需网关与真机；真实 0.0/0.0 源按可得性；无可控源记 NOT EXECUTED
      known_condition: 现场有光且固件无光判据未启用，不得通过调温/改变光强制造占位或升温条件
      normal_targets: 有效读数（含 0.0/0.0）首次即处理；占位显示“网关暂无数据”且无假设备
      abnormal_targets: 全占位/混合占位不产生假读数、不发布整批；占位不触发报警；不清空既有设备与历史
      compatibility_hold: BLE 布局、0.1℃ 单位、负温符号、SQLite 表结构、上传契约不变

  - objective: >-
      让云上传失败可区分、可观测、不丢数据：新增纯逻辑 cloud/UploadResult.kt 把 HTTP 状态/异常分为
      Success(2xx)/AuthRejected(401,403)/RequestRejected(其余 4xx，408/429 除外)/Retryable(5xx,408,429,超时,IO,解析异常)；
      CloudUploadRepository 对 Retryable 沿用既有退避，对 AuthRejected/RequestRejected 不自动重试、保留全部待发行、
      写入 MyPrefs 阻塞状态（原因码/HTTP 状态/时间/待发条数）并在网关设置区展示与提供“重试上传”；手动重试清除阻塞并
      恢复被暂停的到期行后立即上传一次；不新增 Authorization/token/签名头，只在 CloudApiClient 预留唯一拦截器注入点（空实现）。
    input_refs:
      - artifacts/android_architecture.md
      - artifacts/backend_feasibility_current.md
      - artifacts/interface_contract.md
      - dengbei_care/app/src/main/java/com/jinyuni/dengbei_care/cloud/CloudUploadRepository.kt
      - dengbei_care/app/src/main/java/com/jinyuni/dengbei_care/cloud/UploadOutbox.kt
      - dengbei_care/app/src/main/java/com/jinyuni/dengbei_care/ui/zhuce/ApiService.kt
      - dengbei_care/app/src/main/java/com/jinyuni/dengbei_care/ui/notifications/NotificationsFragment.kt
    acceptance:
      - UploadResult 宿主机用例覆盖 200/201/204、401、403、400、404、413、422、408、429、500、502、超时/IO/解析异常的分类，边界无歧义。
      - 2xx 逐行 ack 删除；Retryable 逐行 attempts+1 并按既有 60→1800 s 退避，达到 20 次后保留行不再自动重试（现状保持）。
      - 401/403 与其他 4xx 不产生自动重试请求；本次批次行全部保留且不被删除；MyPrefs 写入原因码/HTTP 状态/时间/待发条数；界面显示具体“上传被拒绝/请求被拒绝”状态与待发条数。
      - “重试上传”清除阻塞状态、把被暂停的到期行恢复为可重试（批量 UPDATE，不改表结构）并立即触发一次上传；重试后成功则删除对应行，失败按新结果重新分类。
      - 上传阻塞与失败不影响 BLE/MQTT/告警/入库；日志不打印手机号、MAC 之外的凭据，不输出请求体全文。
      - 工程内不存在新增的 Authorization/Bearer/token 使用；ApiService 契约与 /upload_data 字段不变；CloudApiClient 仅有一个空的拦截器注入点并有注释说明待端到端 D1 定性。
      - 现有宿主机单元测试全部通过、assembleDebug 成功且无新增编译告警。
      - 真实 401/403 行为、手动重试与持久化回读由端到端/软件测试在获准入口执行；本项不宣称上传可用或 401 原因已定性。
    metadata:
      scope: android_implementation
      relates_to: AA-005 G-6 / D-27 / D-28 / BE-EXP-004
      upstream_acceptance: TD-SW-004 T-SW-L1-30、T-SW-L0d-14/15、T-SW-L2-47/48、T-SW-REG-09
      unknown: 401 的具体机制（token/归属/注册态）未定性；本项不猜测协议，只做分类与可观测状态
      device_dependency: 真实 HTTP 状态与服务端行为需网络与获准测试入口；由端到端阶段执行
      normal_targets: 2xx 删除待发行；网络失败退避；手动重试可恢复
      abnormal_targets: 401/403/4xx 停止自动重试、保留数据、显示原因；不静默滞留、不丢行、不阻塞主链路
