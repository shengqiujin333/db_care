  - objective: >-
      落实 IC-002 v4.0 的容量与读取完整性约束：新增纯逻辑 protocol/GatewayReadGuard.kt 提供 MAX_DEVICES=9、
      MAX_FRAME_BYTES=160、expectedFrameSize(devCount)=16*(1+devCount)、capacityVerdict(boundCount)、
      mtuVerdict(negotiatedMtu, devCount) 与 lengthVerdict(returnedBytes, devCount)；在绑定新增入口
      （MacIdBook 唯一调用方/绑定界面）达到 9 台时明确拒绝并提示，已绑定 >9 台时读路径不发起连接/读取并显示
      BINDING_CAPACITY_EXCEEDED；读路径要求协商 MTU >= 16*(1+N)+3 才读取，并在 onCharacteristicRead 使用
      实际 value.size 校验覆盖完整快照与 16 B 对齐，不满足则整帧拒绝并显示“读取不完整（MTU/长度不足）”；
      不补零、不跨次拼接、不裁掉余字节、不把部分批次当整批；同时修正 buildAllSavedIdsA1SinglePacket 的 50 台
      静默截断，使其与 9 台容量一致。
    input_refs:
      - artifacts/android_architecture.md
      - artifacts/interface_contract.md
      - artifacts/system_analysis_current.md
      - dengbei_care/app/src/main/java/com/jinyuni/dengbei_care/MqtttService.kt
      - dengbei_care/app/src/main/java/com/jinyuni/dengbei_care/MacIdBook.kt
      - dengbei_care/app/src/main/java/com/jinyuni/dengbei_care/protocol/GatewayFrameCodec.kt
      - dengbei_care/app/src/main/java/com/jinyuni/dengbei_care/ui/notifications/NotificationsFragment.kt
      - dengbei_care/app/src/main/java/com/jinyuni/dengbei_care/ui/sensorid/SensorIdListFragment.kt
    acceptance:
      - GatewayReadGuard 为无 Android 依赖纯逻辑；宿主机用例覆盖 capacityVerdict(0..9)=Ok、(10..255)=Exceeded(bound)，expectedFrameSize(1..9)=32..160，mtuVerdict 的 MTU 不足/充足，以及 lengthVerdict 的返回长度不足、非 16 对齐、正常（单/多设备）分支。
      - 绑定第 10 台被明确拒绝（提示“超过网关完整传输上限 9 台”），既有 9 台不变；工程内不再存在按 50 台静默截断写入 0xA1 的路径（容量常量只在一处定义）。
      - 已绑定 >9 台（历史/异常数据）时不发起读取、不写入 0xA1、不转发，链路状态为 BINDING_CAPACITY_EXCEEDED；删除多余设备后下一轮恢复。
      - 读路径使用协商 MTU 判定：MTU < 16*(1+N)+3 时不读取；协商失败只重连重试一次，仍失败则本轮记 READ_INCOMPLETE，不无限重试。
      - onCharacteristicRead 以实际 value.size 判定：< 16*(1+N) 或非 16 B 整数倍时整帧拒绝并记录实际/期望字节；不补零、不使用上次快照、不拼接跨次读取、不裁掉余字节。
      - 读取完整性失败不产生读数、不入库、不入待发箱、不转发；与其他拒绝原因（帧头/N=0/解密/占位）在日志与状态上可区分。
      - 完整快照读取成功时行为与既有解码一致（布局/偏移/字节序/符号不变）；多余 16 B 对齐尾部按 devCount 消费，不把尾块当设备。
      - 现有宿主机单元测试全部通过、assembleDebug 成功且无新增编译告警。
      - 真实 MTU 协商值、FFE2 实际返回字节数与 9 台容量边界由软件测试在真机独立验收；本项不宣称已支持 9 台或真实读取完整。
