items:
  - "修正 BLE 合法零值处理：删除 MqtttService 中 bleZeroCount 计数与 isZeroValue 分支（含不再使用的字段），使每个通过 GatewayFrameCodec 校验的设备块首次读到即作为接收观察进入 processTemperatureHumidityData；期望行为：0.0℃/0.0%RH 首次读到就参与告警判定、守护中写库、门控通过时入上传待发箱，不再需要连续 3 次，且短帧/未对齐/N=0/解密失败仍整帧拒绝、不产生读数；用宿主机测试或可复跑的静态检查证明两条路径。"
  - "修正 MQTT 接收观察语义：删除 MqtttService 中 _bkp_temp_time 整批跳过逻辑，不再按上一批时间/数值/哈希去重；期望行为：每次 ReadingAttribution 成功都逐设备进入业务，同一 (devId, originalTime) 的重复只由本地主键与待发箱主键收敛，不同数值但相同原始时间不被入口丢弃，日志可区分 receivedAt 与 originalTime，不宣称源样本恰一次。"
  - "分离业务入口的 originalTime 与 receivedAt：BLE 路径两者都取 App 接收 Unix 秒，MQTT 路径 originalTime 取载荷首段、receivedAt 取 Service 收到消息的 Unix 秒；processTemperatureHumidityData 及调用点显式传递两者，报警时间窗/本地 temperature.time/上传 time 使用 originalTime，卡片与详情的相对时间使用 receivedAt；期望行为：MQTT 载荷时间较旧时 UI 仍显示真实接收新鲜度，上传/存储时间不被 receivedAt 覆盖，既有 (devId,time) 幂等不变。"
  - "修正无报警基准时的展示副作用：MqtttService 在时间窗基准为空时不再调用 homeViewModel.clearDevice(devId)；期望行为：无历史或距上次上报超过回溯容差时，下降报警分支不成立但卡片已有 sparkline 与最新读数保持，不补点、不清屏、不写 0，首条读数仍正常显示。"
  - "修正条件上报规则方向与文案：把 DetailPresentation.REPORT_RULE_TEXT、fragment_device_detail.xml 的 tools:text、dengbei_care/readme.txt 与 用户使用说明书.md 中所有“温度较上次下降超过 0.9℃”改为“本次温度比上次高超过 0.9℃且无光，或温度超过 35.0℃ 才上报；未满足条件时不会上报，因此可能长时间没有新数据”，并同步更新断言该文案的宿主机测试；期望行为：代码、布局预览、readme、说明书四处方向一致，用户可见文本不再出现“下降超过 0.9”，35.0℃ 严格边界与不显示光照的约束不变。"
  - "明确接收时间展示语义：卡片保留“最近上报 X 分钟/小时/天前”并追加“（App 接收时间）”限定，详情显示“最近上报：X（App 接收时间，非传感器采样时刻）”；同步 DeviceState 的 KDoc/方法说明与布局预览文案；期望行为：用户可见文本不再把相对时间表述为精确源采样时刻，仍不出现“离线”或 30 分钟数据龄判离线，未收到状态与四种状态 chip 不变。"
  - "回归并加固 BLE 有效前缀解码：保持 GatewayFrameCodec 的 16B 头、devCount>=1、size>=16*(1+devCount)、只取前 N 块、尾部忽略与显式拒绝；为 decodeDeviceBlock 增加越界保护或仅允许在已校验范围内调用；期望行为：160B 承载在 N=1/N=2/N=9 时只产生对应数量读数且尾部不产生设备，N=10 的短承载、N=0、未 16B 对齐、解密失败、设备块不足全部拒绝，正/负温与 0/100%RH 边界解析正确。"
  - "回归 MQTT 严格归因与顺序限制：保持 ReadingAttribution 对不足三段、非法/非正时间、空序列、非有限数、数量与 MacIdBook 不一致时整批拒绝且不落库/不上传/不报警；不得恢复 minOf 截断或按位置补零；期望行为：构造数量一致/不一致/交换顺序三组载荷可复跑，顺序交换在数量一致时仍会交换归因（不可检测），该限制写入用户手册 MQTT 排障说明。"
  - "回归既有报警语义：保持 AlarmEvaluator 的 5/10/15 分钟时间窗、温度与湿度双下降 AND、严格阈值比较、>65.0℃ 紧急优先且不节流；保持调用方普通报警 900 秒节流、紧急每次通知、报警文案字面值与 alarm_events 类型不变；期望行为：边界（恰好等于阈值不触发、35.0/35.1、无基准不触发、>65 优先级）宿主机用例全部通过，不因本轮上报文案修正改变报警方向或阈值。"
  - "回归持久化与云上传：保持 TemperatureDatabaseHelper v3 的 temperature/alarm_events 结构与 pending_uploads(device_id,time) 主键；单条写入使用 originalTime、守护才写、不按 60 秒回填；上传仅在守护且手机号非空时入队，空 readings 不发请求，同键已存在不覆盖既有行，HTTP 2xx 删除本批，失败 attempts+1 且按 60 秒起/1800 秒上限退避、20 次后保留不自动重试，业务 time 在重试中不变，上传在独立作用域且不阻塞 BLE/MQTT；期望行为：可用宿主机测试/可复跑脚本证明同键幂等、退避参数、门控关闭不发请求、失败保留与成功删除。"
  - "收敛 MQTT 重连：把 MqtttService.scheduleReconnect 改为单一受管 Job（重复 onStartCommand 不叠加循环），connectionLost 或初始连接失败后由同一循环按有界间隔重连，成功后重新订阅既有 topic；期望行为：连续多次 onStartCommand 只存在一个重连循环，断线后能恢复连接与订阅，重连失败不紧循环、不终止 BLE 轮询与待发箱上传，日志记录尝试与结果。"
  - "修正上传时间语义注释：把 ApiService.SensorReading.time 与 UploadPayload 相关 KDoc 中“真实采样时间”改为“BLE 为 App 接收 Unix 秒；MQTT 为载荷首段原时间；不表示已证实的源采样时刻”，字段名、类型、JSON 与既有 5 个端点保持不变；期望行为：静态检索不再出现把上传 time 称为真实采样时间的注释，构造出的请求体字段与既有契约逐字一致。"
  - "收尾版本与文档：app/build.gradle.kts 升 versionCode 10、versionName 1.9；dengbei_care/readme.txt 追加 V1.9 条目并修正 V1.8 第 2 条的升温方向，说明合法零值、接收时间语义、云上传门控与幂等边界；用户使用说明书.md 同步规则方向、接收时间、MQTT 顺序限制、outbox 重试与稀疏数据说明；同步维护仓库根 file_manifest.txt；期望行为：版本号、readme、说明书与实现行为一致，文档不再出现“下降超过 0.9℃”的板端规则表述。"
  - "实现自检：运行 :app:testDebugUnitTest 与 :app:assembleDebug，记录原始输出与退出码；执行静态检查确认无旧连接目标 117.72.84.210、无 bleZeroCount/isZeroValue、无 60 秒历史回填、无用户可见“离线”状态、无“下降超过 0.9”规则文案、无客户端服务器管理凭据；若仪器化 SQLite 测试因环境依赖不可运行，如实记录阻塞项与已完成的宿主机/构建证据，不伪造真机或端到端通过。"
