[versions]
agp = "8.3.2"
kotlin = "1.9.0"
coreKtx = "1.13.0"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
appcompat = "1.6.1"
material = "1.11.0"
constraintlayout = "2.1.4"
lifecycleLivedataKtx = "2.7.0"
lifecycleViewmodelKtx = "2.7.0"
navigationFragmentKtx = "2.6.0"
navigationUiKtx = "2.6.0"
mpandroidchart = "v3.1.0"
okhttp = "4.9.3"
hivemq-mqtt = "1.3.0"
legacySupportV4 = "1.0.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-lifecycle-livedata-ktx = { group = "androidx.lifecycle", name = "lifecycle-livedata-ktx", version.ref = "lifecycleLivedataKtx" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycleViewmodelKtx" }
androidx-navigation-fragment-ktx = { group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "navigationFragmentKtx" }
androidx-navigation-ui-ktx = { group = "androidx.navigation", name = "navigation-ui-ktx", version.ref = "navigationUiKtx" }
mpandroidchart = { module = "com.github.PhilJay:MPAndroidChart", version.ref = "mpandroidchart" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
espressif = { version = "lib-2.2.0", module = "com.github.espressif:esp-idf-provisioning-android" }
paho-mqtt = { version = "1.2.5", module = "org.eclipse.paho:org.eclipse.paho.client.mqttv3" }
paho-service = { version = "1.1.1", module = "org.eclipse.paho:org.eclipse.paho.android.service" }
localbroadcast= { version = "1.1.0", module = "androidx.localbroadcastmanager:localbroadcastmanager" }
workruntime = {version = "2.8.1", module = "androidx.work:work-runtime-ktx"}
androidx-legacy-support-v4 = { group = "androidx.legacy", name = "legacy-support-v4", version.ref = "legacySupportV4" }
annotation = "androidx.annotation:annotation:1.6.0"
work-runtime = {version = "2.8.1", module = "androidx.work:work-runtime-ktx"}
retrofit = { version = "2.9.0", module = "com.squareup.retrofit2:retrofit" }
convertergson = { version = "2.9.0", module = "com.squareup.retrofit2:converter-gson" }
lifecycle =  { version = "2.6.2", module = "androidx.lifecycle:lifecycle-viewmodel-ktx" }
zxingandroidembedded = { version = "4.3.0", module = "com.journeyapps:zxing-android-embedded" }
zxingcore = { version = "3.5.2", module = "com.google.zxing:core" }


[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
jetbrainsKotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }

